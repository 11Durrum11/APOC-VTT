<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171f">
<meta name="description" content="APOC VTT — the APOC Survival table's shared virtual tabletop: maps, tokens, fog, drawing, dice and initiative on the same shared state as the campaign tracker.">
<title>APOC VTT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
    /* Fields at 75% transparent (Shaun, 2026-11-04; raised from 50% same evening): card/popover/secondary/muted/accent
       surfaces are half-transparent so the scene backdrop shows through;
       text and borders stay opaque so words stay readable. */
    color-scheme:dark;
    --background:hsl(222 22% 10%);
    --foreground:hsl(42 38% 88%);
    --card:hsla(222,20%,14%,0);
    --card-foreground:hsl(42 38% 88%);
    --card-border:hsl(220 16% 24%);
    --popover:hsla(222,20%,13%,0);
    --primary:hsl(38 92% 50%);
    --primary-foreground:hsl(30 40% 10%);
    --secondary:hsla(220,16%,20%,0);
    --muted:hsla(220,16%,20%,0);
    --muted-foreground:hsl(220 12% 62%);
    --accent:hsla(222,18%,22%,0);
    --accent-foreground:hsl(42 38% 90%);
    --destructive:hsl(0 62% 46%);
    --border:hsl(220 16% 24%);
    --input:hsl(220 16% 26%);
    --ring:hsl(38 92% 50%);
    --radius:12px;
    /* Interim hotlink: the scene files sit in this repo under
       assets/scenes/ (same paths as the tracker) once uploaded; until
       then the backdrop loads them from the tracker site. */
    --scene-image:url("assets/scenes/bastion-streets.webp");
  }
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;overflow-x:clip}
body{
    margin:0;background:var(--background);color:var(--foreground);
    font-family:Georgia,"Times New Roman",serif;line-height:1.5;
    overflow-x:hidden;overflow-x:clip;min-height:100vh;min-height:100dvh; /* dvh second (v1.63): 100vh resolves a hair taller than the visible viewport in Chrome, which alone forced a ~2px scroll on a page that otherwise fits */
  }
/* The backdrop: the tracker shell's layer, ported as-is — a PLAIN fixed
   layer, no transform, no filter, no will-change. The tracker's settled
   end-state layers NOTHING in front of it (every veil/sheen/scrim off —
   only the backdrop picture, the text and the borders remain), so the
   ::after scrim is display:none here too. */
body::before{
    content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-2;
    background-image:var(--scene-image);background-size:cover;background-position:center;
    opacity:var(--bg-opacity,.45);transition:opacity 1.5s ease;
  }
body::after{display:none}
a{color:var(--primary)}
button,input,select,textarea{font:inherit}
button,select,input,textarea{color:var(--foreground)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.page{width:min(1180px,100%);margin:0 auto;padding:0 16px 12px}
.eyebrow{margin:0 0 4px;color:var(--primary);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:.92;margin:0;font-weight:500;letter-spacing:.01em}
.panel{
    background:hsla(222,20%,14%,0);border:1px solid var(--card-border);backdrop-filter:blur(3px);
    border-radius:var(--radius);padding:10px;margin-top:8px;
    box-shadow:0 14px 32px rgba(0,0,0,.18);
  }
#mapPanel{position:relative}
.panel h2{margin:0 0 6px;font-size:clamp(1.3rem,3.4vw,1.7rem);font-weight:500}
.panel h3{font-weight:500}
.muted{color:var(--muted-foreground)}
.small{font-size:.9rem}
.top-bubbles .panel,.top-bubbles .sky-panel{margin-top:0}
.map-frame{margin-top:14px;border:1px solid var(--card-border);border-radius:10px;overflow:hidden;background:transparent}
.map-frame iframe{display:block;width:100%;height:min(74vh,680px);min-height:380px;border:0}
.map-note{margin-top:12px;border-left:3px solid var(--primary);padding:8px 12px}
.map-actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.map-open{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border-radius:10px;background:transparent;color:var(--primary);border:1px solid var(--primary);text-decoration:none;font-weight:600}
.map-sub{margin:22px 0 6px;font-size:1.05rem}
.apoc-map{height:min(72vh,640px);min-height:380px;border:1px solid var(--card-border);border-radius:10px;overflow:hidden;background:transparent;z-index:0}
.leaflet-container{font:inherit}
.mk-icon{background:none;border:none}
.mk{display:flex;align-items:center;gap:6px}
.mk-under{flex-direction:column;align-items:center;gap:3px}
.mk-under2 .mk-label{margin-top:24px}
.mk-dot{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid #0d0f14;box-shadow:0 1px 5px rgba(0,0,0,.55)}
.mk-label{background:rgba(10,12,16,.8);color:#f2e7c8;padding:2px 7px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.22)}
.mk-city .mk-dot{background:#e8a33d}
.mk-party .mk-dot{background:#58b368}
.mk-place .mk-dot{background:#7aa2c4}
.mk-danger .mk-dot{background:#d9534f}
.mk-note .mk-dot{background:#9a86c8}
.mk-temp{opacity:.6}
.marker-form{margin-top:12px;border:1px solid var(--card-border);border-radius:10px;padding:13px}
.map-status{margin-top:9px}
.map-tools{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.map-tools .field{flex:1 1 240px;position:relative}
.place-results{position:absolute;top:100%;left:0;right:0;z-index:80;margin-top:4px;background:hsl(222,20%,13%);border:1px solid var(--card-border);border-radius:10px;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.42)}
.place-results button{display:block;width:100%;text-align:left;padding:10px 12px;min-height:44px;background:none;border:none;border-bottom:1px solid var(--border);color:var(--foreground);font-size:.92rem}
.place-results button:last-child{border-bottom:none}
.place-results button:hover,.place-results button:focus-visible{background:hsl(222,18%,22%)}
.place-results .pr-kind{color:var(--muted-foreground);font-size:.78rem}
.place-results .pr-empty{padding:10px 12px;color:var(--muted-foreground);font-size:.9rem}
.atlas-toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:.9rem;color:var(--accent-foreground)}
.atlas-toggle input{width:20px;height:20px;min-height:20px}
.atlas-icon{background:none;border:none}
.atlas-dot{display:block;width:10px;height:10px;border-radius:50%;background:#e9e2cf;border:2px solid #22242c;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.place-card{margin:0 0 12px;border:1px solid var(--card-border);border-left:3px solid var(--primary);border-radius:10px;padding:12px 14px;background:hsl(222,20%,13%)}
.place-card h4{margin:0 0 3px;font-size:1.02rem;cursor:move;touch-action:none}
.place-card.floating{position:fixed;z-index:1200;margin:0;box-shadow:0 18px 42px rgba(0,0,0,.5)}
.place-card p{margin:5px 0 0}
.place-card .pc-close{float:right}
.pin-imgs{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.pin-imgs img{width:100%;border-radius:6px;display:block}
.place-card .pin-imgs img{cursor:zoom-in}
.pin-lightbox{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.pin-lightbox img{max-width:96vw;max-height:96vh;border-radius:8px}
.leaflet-popup-content .pin-imgs img{margin-top:6px}
.mk-ruin .mk-dot{background:#c47b4a}
.mk-ghost .mk-dot{background:#c9cdd6}
.mk-dead .mk-dot{background:#43464d;border-color:#c9cdd6}
.mk-altered .mk-dot{background:#57b8a2}
.apoc-on .leaflet-image-layer{filter:grayscale(.55) sepia(.14) brightness(.93) contrast(1.03)}
#apocMap:fullscreen{height:100%;width:100%;border:none;border-radius:0}
body.map-expanded{overflow:hidden}
body.map-expanded #mapPanel{position:fixed;inset:0;width:100vw;height:100vh;z-index:1600;overflow-y:auto;display:flex;flex-direction:column;background-image:var(--scene-image);background-size:cover;background-position:center;padding:8px;gap:5px;margin:0;border-radius:0}
body.map-expanded .map-stage{flex:1 1 auto;min-height:0;width:100%;margin-top:0}
body.map-expanded .apoc-map{height:100%;min-height:0}
body.map-expanded .vtt-panel{flex:none;max-height:32vh;overflow-y:auto;margin-top:0;width:100%}
#apocMap:fullscreen{height:100%;width:100%;border:none;border-radius:0}
#apocMap{touch-action:none} /* v1.72: no browser pinch-zoom over the map; one-finger drag still pans via Leaflet */
.expand-exit-wrap{display:none}
body.map-expanded .expand-exit-wrap{display:block}
body.map-fs .expand-exit-wrap{display:block}
.map-stage:fullscreen{position:relative;width:100%;height:100%;background:#05070a;align-items:stretch}
.map-stage:fullscreen .map-side{display:flex;flex-direction:column}
.map-stage:fullscreen .apoc-map{flex:1 1 auto;height:100%;min-height:0}
/* Shaun (2026-11-06 ~20:01, superseding the v1.31–v1.33 floating
   utensils): in the enlarged view the floating groups are UNDONE —
   the map sits off to the left and ALL the utensil groups stack in
   one rail on the right of the stage, in page order, fully visible,
   nothing overlapping and nothing floating over the play area. The
   rail is one scrolling column; groups keep their own layout inside
   it. On exit every group returns to its place below the map. */
.map-stage:fullscreen .fs-rail{display:flex;flex-direction:column;gap:10px;flex:0 0 min(380px,34vw);min-width:0;height:100%;overflow-y:auto;overflow-x:hidden;padding:2px 2px 10px}
.map-stage:fullscreen .fs-rail .map-tools{flex:none;margin-top:0;width:100%}
.map-stage:fullscreen .fs-rail .vtt-col{flex:none;width:100%;max-width:none}
.map-stage:fullscreen .fs-rail .ff-grip{display:none}
.ff-grip{display:none}
#gmBtn{touch-action:none;opacity:.48;filter:saturate(.3);transition:opacity .18s ease,filter .18s ease}
#gmBtn.holding{opacity:.85;filter:saturate(.7)}
#gmBtn[aria-pressed="true"]{opacity:1;filter:none}
  /* v1.60: ONE row of buttons under the map (Shaun, voice call 2026-11-06 ~23:29).
     Every control set lives nested inside exactly one row button, collapsed on
     load; opening one closes the others. The row sits in page flow — the
     perimeter/parking system never touches it. */
  .ctl-row { margin: 8px 0 2px; } /* v1.68: row nudged up a tad (was 10px 0 4px) */
  .ctl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ctl-bar > #gmBtn { margin-left: 0; }
  .ctl-bar > #gmStatus { flex-basis: 100%; margin: 0; }
  .ctl-tab { font: inherit; font-size: 0.95rem; padding: 9px 16px; border-radius: 10px; border: 1px solid #6b5a33; background: #241d12; color: #f3e2b3; cursor: pointer; }
  .ctl-tab[aria-expanded="true"] { background: #6b5a33; color: #fff7e0; }
  .ctl-tab .ctl-caret { opacity: 0.75; font-size: 0.8em; margin-left: 5px; }
  .ctl-set { margin-top: 8px; border: 1px solid #3a3f47; border-radius: 12px; padding: 10px 12px; background: rgba(16, 19, 24, 0.65); }
  /* v1.73 (Shaun, 2026-11-07 ~13:43): the Map button's subcategories sit THREE ABREAST — three per row, wrapping into rows of three, inside the Map set ONLY (not the button row, not the other sets). The [hidden] rule must outrank the grid display or the closed set would show. */
  #set-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; align-items: start; }
  #set-map[hidden] { display: none; }
  #set-map > * { min-width: 0; }
  #set-map .field input, #set-map .field select { max-width: 100%; }
  .ctl-set[hidden] { display: none; }
  .ctl-set > .map-tools, .ctl-set > .vtt-panel { margin: 0 0 8px; }
  .ctl-set > .map-tools:last-child, .ctl-set > .vtt-panel:last-child { margin-bottom: 0; }
  .ctl-set > form.marker-form { position: static; margin: 8px 0 0; }
  .ctl-set .vtt-panel { display: flex; gap: 14px; flex-wrap: wrap; }
  .ctl-set .vtt-col { flex: 1 1 320px; min-width: 280px; }
.tk-icon{background:none;border:none}
.tk{position:relative}
.tk-disc{border-radius:50%;border:3px solid #0d0f14;box-shadow:0 2px 8px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-weight:700;color:#101319;overflow:hidden;margin:0 auto}
.tk-disc img{width:100%;height:100%;object-fit:cover;display:block}
.tkc-amber .tk-disc{background:#e8a33d}
.tkc-red .tk-disc{background:#d9534f}
.tkc-blue .tk-disc{background:#7aa2c4}
.tkc-green .tk-disc{background:#58b368}
.tkc-violet .tk-disc{background:#9a86c8}
.tkc-grey .tk-disc{background:#a7adb8}
.tk-hp{height:6px;border-radius:3px;background:rgba(10,12,16,.75);border:1px solid rgba(255,255,255,.35);margin-top:3px;overflow:hidden}
.tk-hp span{display:block;height:100%}
.tk-status{display:flex;gap:3px;justify-content:center;margin-top:3px;min-height:9px}
.tk-status i{width:9px;height:9px;border-radius:50%;border:1px solid #0d0f14;display:block}
.tk-label{display:block;text-align:center;margin-top:3px;background:rgba(10,12,16,.8);color:#f2e7c8;padding:2px 7px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.22);width:max-content;margin-left:auto;margin-right:auto}
.status-chips{display:flex;flex-wrap:wrap;gap:7px}
.status-chips button{min-height:40px}
.status-chips button[aria-pressed="true"]{background:transparent;color:var(--primary);border-color:var(--primary)}
.ruler-label{background:rgba(10,12,16,.85);color:#f2e7c8;padding:3px 9px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;border:1px solid var(--primary)}
.scale-input{width:96px}
.tk-gm .tk-disc{border-style:dashed;border-color:#e8a33d}
.draw-text{background:rgba(10,12,16,.82);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.85rem;white-space:nowrap;border:1px solid rgba(255,255,255,.25)}
.lib-panel{border:1px solid hsl(222 18% 26%);border-radius:12px;padding:12px;margin:4px 0 10px}
.lib-head{font-weight:700;margin:10px 0 6px}
.lib-grid{display:flex;flex-wrap:wrap;gap:8px}
.lib-item{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:1px solid hsl(222 18% 28%);border-radius:10px;padding:6px;cursor:pointer;color:inherit;width:76px}
.lib-item img{width:56px;height:56px;object-fit:cover;border-radius:50%}
.lib-sym{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;font-size:25px;font-weight:700}
.lib-cap{font-size:.68rem;text-align:center;line-height:1.15}
.layer-chips{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.layer-chip{border:1px solid hsl(222 18% 28%);border-radius:999px;padding:2px 6px 2px 10px;font-size:.8rem}
.chip-eye{margin-left:4px}
.vtt-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
@media (max-width:820px){
.vtt-panel{grid-template-columns:1fr}
}
.vtt-col{background:var(--card);border:1px solid var(--card-border);border-radius:11px;padding:16px;min-width:0}
.vtt-col h3{margin:0 0 10px;font-size:1.08rem}
.quick-dice{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.macro-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.macro-chip{display:inline-flex;gap:2px}
.dice-log{list-style:none;margin:10px 0 0;padding:0;max-height:290px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.dice-log li{background:transparent;border:1px solid var(--card-border);border-radius:8px;padding:7px 10px;font-size:.92rem}
.dice-log .dl-total{font-weight:800;color:var(--primary)}
.init-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.init-row{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid var(--card-border);border-radius:8px;padding:6px 9px}
.init-row.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.init-row .init-name{flex:1;font-weight:600;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.init-row input{width:70px}
.init-strip{background:rgba(10,12,16,.87);color:#f2e7c8;padding:6px 10px;border-radius:8px;font-size:.8rem;border:1px solid rgba(255,255,255,.25);max-width:48vw;line-height:1.45}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:.86rem;color:var(--accent-foreground)}
input,select,textarea{
    width:100%;border:1px solid var(--input);border-radius:8px;background:var(--popover);
    padding:10px 11px;min-height:44px;
  }
textarea{min-height:96px;resize:vertical}
/* Shaun (2026-11-06): the dropdown menus rendered white on white —
   unreadable. Every select's opened list is black text on white. */
select option,select optgroup{background:#ffffff;color:#000000}
.button-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.btn{
    border:1px solid var(--card-border);background:var(--secondary);color:var(--foreground);
    border-radius:9px;padding:10px 15px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  }
.btn:hover{background:var(--accent);color:var(--accent-foreground)}
.btn.primary{background:transparent;border-color:var(--primary);color:var(--primary);font-weight:700}
.btn.danger{background:transparent;border-color:var(--destructive);color:#f0b1b1}
.btn.danger:hover{background:transparent;color:#f0b1b1}
.status-line{min-height:1.5em;margin:10px 0 0;color:var(--muted-foreground)}
.warning{border-left:4px solid var(--primary);background:transparent;padding:10px 12px;margin-top:12px}
.error{border:1px solid var(--destructive);background:transparent;padding:11px 13px;border-radius:9px;margin-top:14px}
[hidden]{display:none !important}
.actions .btn{min-height:38px;padding:7px 11px}
@media (max-width:760px){
.page{padding:0 10px 22px}
.form-grid{grid-template-columns:1fr}
.panel{padding:16px}
}
.panel,.sky-panel{backdrop-filter:none}

/* ---- APOC VTT standalone shell additions ---- */
.vtt-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 2px}
.vtt-head h1{margin:0}
/* ---- Ping (Roll20): expanding ring + steady dot, anchored on the pinged point ---- */
.ping-icon{background:none;border:none}
.ping-ring{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:3px solid #e8a33d;animation:pingring 1.1s ease-out infinite;pointer-events:none}
.ping-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#e8a33d;box-shadow:0 0 6px #000;pointer-events:none}
@keyframes pingring{0%{transform:scale(.4);opacity:1}100%{transform:scale(3.4);opacity:0}}

/* ---- Usability pass (v1.01) + site treatment (v1.02) ----
   Presentation only: no ids, keys or shared-state shapes change here.
   Buttons take the hub treatment (transparent, amber on hover/tap and
   when pressed); the backdrop rules sit with the body rule above. */
.btn:hover{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn[aria-pressed="true"]{background:transparent;color:var(--primary);border-color:var(--primary)}
#ambBtn[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}
body.bg-animated::before{animation:none}
@media (prefers-reduced-motion: reduce){body::before{animation:none !important}}
.map-tools .btn{min-height:48px;padding:12px 18px;font-size:1rem}
.map-tools .atlas-toggle{min-height:48px}
.lib-item{min-height:64px}
.lib-cap{font-size:.8rem}
.chip-eye{min-width:36px;min-height:36px}
/* Repository-ready stage: map + side rail. The rail keeps the token
   repository (and the DM monster repository to come) BESIDE the map on wide
   screens; on phones it stacks under the map. It collapses entirely while
   the repository panel is closed, so the map keeps full width. */
.map-stage{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.map-stage .map-side{flex:1 1 auto;min-width:0}
.map-repo{flex:0 0 300px;min-width:0}
.map-repo:has(.lib-panel[hidden]):not(:has(.lib-panel:not([hidden]))):has(> #placeCard[hidden]){display:none}
.map-repo .lib-panel{margin:0}
@media (max-width:820px){
.map-stage{flex-direction:column}
.map-repo{flex:none;width:100%}
.apoc-map{height:62vh;min-height:340px}
.panel{padding:12px}
}
@media (pointer:coarse){
input,select,textarea{font-size:16px}
}

/* ---- v1.03: layer tabs, drop highlight, stamps, fullscreen edges ---- */
.layer-chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;align-items:stretch;padding:4px 2px;flex:1 1 auto;min-width:0}
.layer-chip{display:inline-flex;align-items:center;gap:2px;border:1px solid hsl(222 18% 28%);border-bottom-width:3px;border-radius:10px 10px 4px 4px;padding:2px 4px 2px 12px;font-size:.9rem;white-space:nowrap;cursor:pointer;min-height:44px;background:transparent}
.layer-chip.active{border-color:var(--primary);color:var(--primary);box-shadow:inset 0 -3px 0 var(--primary)}
.chip-eye{min-width:40px}

/* ===== v1.04: Paint palette, template handles, repo drawer (Roll20 right dock) ===== */
.paint-pal{display:block}
.wheel-wrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;padding:6px 2px}
.wheel-disc-wrap{position:relative;width:220px;height:220px;flex:none}
#wheelCanvas{width:220px;height:220px;border-radius:50%;cursor:crosshair;touch-action:none;display:block}
.wheel-marker{position:absolute;width:16px;height:16px;border:2px solid #fff;outline:1px solid rgba(0,0,0,.65);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.wheel-side{display:flex;flex-direction:column;gap:8px;min-width:200px;flex:1 1 200px}
.wheel-chip{height:38px;border:1px solid hsl(222 18% 30%);border-radius:8px}
.wheel-side input[type="text"]{width:92px;text-transform:lowercase}
.wheel-rgb{display:flex;gap:10px;flex-wrap:wrap}
.wheel-rgb input[type="number"]{width:60px}
.wheel-side label{font-size:.82rem;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
.wheel-side input[type="range"]{flex:1 1 auto;min-width:110px}
.pal-swatch{width:30px;height:30px;min-height:30px;border:1px solid hsl(222 18% 30%);border-radius:6px;padding:0;cursor:pointer}
.pal-swatch[aria-pressed="true"]{outline:2px solid var(--primary);outline-offset:1px}
.color-chip{display:inline-block;width:26px;height:26px;border-radius:6px;border:1px solid hsl(222 18% 30%);flex:none}
.wheel-open-btn{display:inline-flex;align-items:center;gap:8px;min-height:34px}
.lib-item{touch-action:none}
.drag-ghost{position:fixed;z-index:3000;pointer-events:none;opacity:.88;width:76px;height:76px}
.tpl-handle-icon{background:transparent;border:none}
.tpl-handle{display:block;width:22px;height:22px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5);cursor:grab}
#repoTab{display:none}
@media (max-width:820px){

  .map-repo{position:fixed;top:0;right:0;height:100dvh;width:min(320px,86vw);flex:none;z-index:1500;background:var(--background);overflow-y:auto;padding:10px;box-shadow:-14px 0 34px rgba(0,0,0,.45)}
  .map-repo:has(#tokenLib[hidden]){display:none}

/* Full screen (Shaun): the whole panel goes fullscreen; the story text

   top, dice/initiative bottom, repository beside the map) and

#mapPanel:fullscreen{display:flex;flex-direction:column;height:100%;overflow-y:auto;background-image:var(--scene-image);background-size:cover;background-position:center;padding:8px;gap:5px}
#mapPanel:fullscreen .map-tools{flex:none}

#mapPanel:fullscreen .vtt-panel{flex:none;max-height:32vh;overflow-y:auto;margin-top:0;width:100%}
#mapPanel:fullscreen .marker-form{flex:none;max-height:44vh;overflow-y:auto}
#mapPanel:fullscreen .btn,#mapPanel:fullscreen .vtt-col,#mapPanel:fullscreen .lib-panel,#mapPanel:fullscreen input,#mapPanel:fullscreen select,#mapPanel:fullscreen textarea{background:transparent}

/* ---- v1.06: perimeter-always + movable groups (Shaun) ----
   Desktop/table: every functionality lives around the edges of the
   table at ALL times — tools top, repository right, dice/initiative
   bottom, map clean in the middle — in normal view, Full screen,
   Expand and Project alike: nothing hides, collapses or relocates.
   Groups can be dragged by their grip to any edge of the panel; they
   re-orient (top/bottom = horizontal row, left/right = vertical
   stack) and stay transparent. Arrangement persists per device in
   localStorage key "apocVttPerimeterV2" (epoch V2 since v1.56 — the
   V1 parks belonged to the pre-restore layout and are discarded).
   Phones keep the drawer. */
.per-grip{display:none}
@media (min-width:821px){
  .per-grip{display:none;align-items:center;gap:6px;flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1px dashed hsl(220 16% 34%);border-radius:8px;padding:4px 10px;min-height:36px;font-size:.8rem;color:var(--muted-foreground);background:transparent;white-space:nowrap}
  .per-grip:active{cursor:grabbing}
  .map-repo .per-grip{display:flex;margin:0 0 8px}
  .vtt-col .per-grip{margin:0 0 8px}
  .per-group{scrollbar-width:thin}
  .per-parked{position:absolute !important;z-index:900;background:transparent !important;backdrop-filter:none;max-width:calc(100% - 12px)}
  .per-parked.per-h{flex-direction:row !important;flex-wrap:wrap;align-items:flex-end}
  .map-tools.per-parked.per-h{max-height:46%;overflow-y:auto}
  .per-parked.per-v{flex-direction:column !important;flex-wrap:nowrap;align-items:stretch;width:min(272px,42vw);max-height:calc(100% - 12px);overflow-y:auto;overflow-x:hidden}
  .per-parked.per-v .field{flex:none !important;width:100%}
  .per-parked.per-v .btn{width:100%}
  .per-parked.per-v .atlas-toggle{width:100%}
  .map-repo.per-parked{flex:none}
  .map-repo.per-parked.per-v{width:min(300px,44vw)}
  .map-repo.per-parked.per-h{width:auto;max-width:calc(100% - 12px)}
  .map-repo.per-parked.per-h .lib-grid{flex-wrap:nowrap;overflow-x:auto}
  .vtt-col.per-parked{z-index:950;padding:10px}
  .vtt-col.per-parked.per-v{width:min(320px,44vw);max-height:calc(100% - 12px);overflow-y:auto}
  .vtt-col.per-parked.per-h{width:auto;max-height:52%;overflow-y:auto}
  .per-dragging{position:fixed !important;z-index:2600 !important;opacity:.94;outline:2px dashed var(--primary);outline-offset:2px;background:transparent !important;box-shadow:none;pointer-events:auto}
  .vtt-col.per-collapsible h3{cursor:pointer;display:inline-block;margin:0 0 8px;vertical-align:middle}
  .vtt-col.per-collapsible h3::after{content:"▾";margin-left:8px;color:var(--primary)}
  .vtt-col.per-collapsible.per-collapsed h3{margin-bottom:0}
  .vtt-col.per-collapsible.per-collapsed h3::after{content:"▸"}
  .vtt-col.per-collapsible.per-collapsed>*:not(.per-grip):not(h3){display:none !important}
}

/* v1.06 fix: Delete Layer at half width, label stacked on two lines
   ("Delete" over "Layer"); height stays a full 44px tap target. */
#layerDelBtn{flex:0 0 68px;width:68px;min-width:68px;max-width:68px;padding:5px 4px;line-height:1.05;text-align:center;white-space:normal}

/* v1.06 scoot-up: the whole stack packs tight — header, tool rows,
   draw/palette/layers groups, stage and bottom panel all sit higher
   with the dead gaps between them closed. */
.vtt-head{margin:0}
#mapPanel{margin-top:2px}
#mapPanel>p{margin-top:4px;margin-bottom:4px}
.map-note{margin-top:6px}
.map-tools{margin-top:14px}
.map-stage{margin-top:6px}
.marker-form{margin-top:12px}
.vtt-panel{margin-top:14px}

/* ---- v1.09: dynamic lighting (Light layer) ---- */
.light-icon{background:none;border:none}
.light-dot{display:block;width:18px;height:18px;border-radius:50%;border:2px solid #0d0f14;margin:0 auto}
.light-name{display:block;text-align:center;margin-top:3px;background:rgba(10,12,16,.8);color:#f2e7c8;padding:2px 7px;border-radius:999px;font-size:.72rem;font-weight:600;white-space:nowrap;border:1px solid rgba(255,255,255,.22);width:max-content;margin-left:auto;margin-right:auto}
/* ---- v1.07: Push to TV display mode (?display=1) ----
   The TV copy of this same page: JUST THE MAP — player view, no
   controls, no perimeter groups, no panels, no header, no story
   text, no GM-only material, editing locked (the isProjecting()
   guards treat displaying exactly like projecting). It follows the
   shared state live — active map, tokens, fog, drawings, pings —
   while the laptop copy keeps every control. This is the one
   explicit exception to the v1.06 perimeter-always rule. */
body.displaying{background:#000}
body.displaying .page{max-width:none;padding:0}
body.displaying .vtt-head,
body.displaying #mapPanel>p,
body.displaying .map-tools,
body.displaying .ctl-row,
body.displaying .marker-form,
body.displaying .vtt-panel,
body.displaying .map-repo,
body.displaying #repoTab,
body.displaying .expand-exit-wrap,
body.displaying .map-status,
body.displaying #placeCard,
body.displaying .leaflet-control-container{display:none !important}
body.displaying #mapPanel{position:fixed;inset:0;width:100vw;height:100vh;margin:0;padding:0;border:0;border-radius:0;background:#000;overflow:hidden}
body.displaying .map-stage{margin:0;height:100%}
body.displaying .map-side{flex:1 1 auto;min-width:0;height:100%}
body.displaying .apoc-map{height:100% !important;min-height:0}
body.displaying .mk-label{font-size:1.12rem;padding:4px 12px}
body.displaying .mk-dot{width:22px;height:22px}
body.displaying .atlas-dot{width:14px;height:14px}
body.displaying .tk-label{font-size:1.12rem;padding:4px 12px}
body.displaying .draw-text{font-size:1.1rem}
body.displaying .init-strip{font-size:1.05rem}
/* ---- v1.08: Maps repository (Shaun) — every saved map, browsable in
   its own right inside the right-edge repository rail: name +
   thumbnail, load on tap, remove with confirm. Built-ins (Faerûn,
   Saint James) are listed first and protected. The collection rides
   the same shared vtt_dropmaps registry + cody-artwork bucket as
   dropped maps, so it is shared on every screen at full resolution. */
#mapRepo{margin-top:10px}
.mr-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow-y:auto;margin-top:6px}
.mr-item{display:flex;gap:8px;align-items:center;border:1px solid hsl(222 18% 26%);border-radius:10px;padding:5px;cursor:pointer;background:transparent;text-align:left;width:100%}
.mr-item:hover{border-color:var(--primary)}
.mr-item.mr-current{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.mr-item img{width:52px;height:52px;object-fit:cover;border-radius:6px;flex:none;background:#000}
.mr-meta{min-width:0;flex:1 1 auto}
.mr-name{display:block;font-size:.86rem;line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.mr-sub{display:block;font-size:.72rem;opacity:.75}
.mr-del{flex:none;min-width:36px;min-height:36px;border-radius:8px;border:1px solid hsl(0 40% 40%);background:transparent;color:#e08a8a;cursor:pointer}
.mr-move{flex:none;min-width:36px;min-height:36px;border-radius:8px;border:1px solid hsl(222 18% 32%);background:transparent;color:inherit;cursor:pointer}
.mr-move-sel{flex:none;max-width:150px;min-height:36px;border-radius:8px;background:transparent;color:inherit;font-size:.78rem}
.mr-folder{font-size:.78rem;font-weight:700;margin:8px 0 2px;opacity:.85}

/* ---- v1.11: Art Library nesting (Shaun) — everything art-related sits
   nested under its own header, and those headers nest under ONE parent
   header, "Art Library", in the right-edge rail. Headers are minimized
   by default and expand on tap (Shaun's nested pattern); item grids and
   lists exist only inside an expanded header. Transparent throughout. */
.artlib{border:1px solid hsl(222 18% 26%);border-radius:12px;padding:2px 8px 8px;background:transparent}
.artlib .lib-panel{border:0;border-radius:0;padding:0;margin:0;background:transparent}
.nest{border:1px solid hsl(222 18% 28%);border-radius:10px;margin:8px 0;background:transparent}
.nest-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:transparent;border:0;border-radius:10px;color:inherit;font:inherit;font-weight:700;text-align:left;padding:8px 10px;min-height:44px;cursor:pointer}
.nest-head::after{content:"▸";color:var(--primary);flex:none;font-weight:700}
.nest.open > .nest-head::after{content:"▾"}
.nest-body{display:none;padding:2px 8px 10px}
.nest.open > .nest-body{display:block}
.artlib-head{font-size:1.08rem;padding:10px}
.mr-nest{margin:6px 0}
.mr-folder-head{font-size:.82rem;min-height:40px;padding:6px 10px}
.mr-body{padding:2px 4px 8px}/* ---- 3D view ---- */
#tdWrap{position:relative;height:min(76vh,880px);background:#05070a;border:1px solid #2b2f38;border-radius:10px;overflow:hidden;margin-top:6px}
#tdCanvas,#tdCanvas canvas{width:100%;height:100%;display:block}
.td-ui{position:absolute;top:8px;left:8px;display:flex;gap:10px;align-items:center;background:rgba(8,10,14,.55);padding:6px 8px;border-radius:8px;z-index:5}
.td-hint{color:#cfd3da;font-size:.78rem}
body.displaying #tdWrap{height:100%;margin:0;border:0;border-radius:0}
body.displaying .td-ui{display:none}


/* ---- Monster repository (MM I population) ---- */
.mon-badge{font-size:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#0d0f14;background:var(--primary);border-radius:999px;padding:1px 6px}
.mon-cr{display:block;font-size:.62rem;opacity:.75}
.mon-info{position:absolute;top:2px;right:4px;font-size:.8rem;opacity:.75;cursor:pointer;padding:2px}
.mon-info:hover{opacity:1}
.lib-item{position:relative}
.mon-none{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;border:2px dashed hsl(222 16% 40%);font-size:20px;font-weight:700;opacity:.7}
.monster-detail{border:1px solid hsl(222 18% 28%);border-radius:10px;padding:10px;margin-top:10px;background:transparent}
.monster-detail h4{margin:0 0 4px;font-size:.95rem}
.monster-detail p{margin:4px 0;font-size:.82rem;line-height:1.35}
.mon-flag{display:inline-block;border:1px solid hsl(0 45% 45%);color:#e8a0a0;border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:700;margin:2px 4px 2px 0}
/* ---- map generator ---- */
#genNest{flex:1 1 100%}
.gen-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:4px 2px}

/* ---- v1.54: map maximized in its bubble (Shaun, 2026-11-06 ~21:25-21:28):
   the map viewing area uses the whole panel edge to edge on all four
   sides — flush at the top (no margin holding the stage down), flush
   left (the black side strip gone), opened all the way up (wider
   page, taller box) and extending all the way down to the point
   where the under-map status text sat (no bottom band reserved for
   it: the status line keeps no margin, and an emptied status line
   takes no space at all). The fit script at the end of the body
   sizes the Leaflet box to the current map's own aspect inside this
   maximized stage, so the map image itself fills the box edge to
   edge with no letterbox strip on any side. Fullscreen / Expand /
   TV display keep their own full-bleed rules — the script clears
   its inline sizing in those modes. */
.page{width:min(1720px,100%)}
#mapPanel{padding-top:6px}
#mapPanel .map-stage{margin-top:0}
.apoc-map{height:min(88vh,980px)}
#tdWrap{margin-top:0}
.map-status{margin-top:0}
#mapStatus:empty{display:none}

/* ---- v1.63: header over the Art Library + closed page fits one screen
   (Shaun, voice call 2026-11-07 ~00:03-00:04; finished at his word
   2026-11-07 ~04:27). The APOC VTT header + version badge ride over the
   RIGHT column, above the Art Library, so the map's own column starts
   with the map itself — no header band holding the stage down. The
   header is positioned, not moved in the DOM: the perimeter script
   stewards the aside itself as the draggable dock, so the header must
   not live inside it. The aside keeps a matching top pad so its first
   content clears the header. The map height cap now reserves the page
   chrome (panel + the closed button row, ~103px measured) so map + row
   fit one screen with every set collapsed; the fit script below uses
   the same reserve (144px since v1.68). Fullscreen / Expand / TV display keep their
   own full-bleed rules. */
.page{position:relative}
#mapPanel{margin-top:0} /* its old 2px top margin collapsed through .page and body, shifting the whole page down 2px and forcing a 2px scroll range on a page that otherwise fits */
.vtt-head{position:absolute;top:0;right:27px;width:300px;margin:0;z-index:5}
/* v1.67 (Shaun, voice call 2026-11-07 ~10:10): the version tag sat
   garbled — at the global h1 size "APOC VTT" alone takes 284px of the
   300px header, so the tag wrapped to a second line under the title.
   The header now keeps ONE line: title sized to the column, tag beside
   it on the right, baseline-aligned, never wrapping. */
.vtt-head{flex-wrap:nowrap;align-items:baseline}
.vtt-head h1{font-size:2.4rem;white-space:nowrap}
#siteVersion{white-space:nowrap;flex:none}
.map-repo{padding-top:52px}
.apoc-map{height:min(calc(100vh - 144px),980px)} /* v1.68: reserve deepened 120 -> 144 (see the fit script) */
/* v1.68: manual drag-resize handles for the map window — they live
   outside the Leaflet surface, in the gap under the window, the
   gutter right of it, and their corner (see the fit script).
   v1.70: top and left handles added, plus the remaining corners —
   the top handle sits in the stage's top margin, the left handle
   in the panel's left padding, and the top-left corner straddles
   the two, so every edge and corner of the window drags. */
.map-side{position:relative}
/* v1.68 reflow: while a manual width is active the page grows to
   fit its contents and the map column hugs the window, so growing
   the window pushes the Art Library right as one intact block (its
   flex is already 0 0 300px) and the page-anchored header stays
   over it; height growth is plain flow — the button row below the
   stage shifts down untouched. Inert in fullscreen / Expand / TV,
   where the fit pass clears the window's inline size anyway. */
.page.man-w{width:fit-content}
.page.man-w .map-side{flex:0 0 auto}
.map-rsz{position:absolute;z-index:950;touch-action:none;-webkit-user-select:none;user-select:none}
.map-rsz-r{cursor:ew-resize;width:9px}
.map-rsz-b{cursor:ns-resize;height:9px}
.map-rsz-br{cursor:nwse-resize;width:15px;height:15px}
.map-rsz-l{cursor:ew-resize;width:9px}
.map-rsz-t{cursor:ns-resize;height:9px}
.map-rsz-tl{cursor:nwse-resize;width:15px;height:15px}
.map-rsz-tr{cursor:nesw-resize;width:15px;height:15px}
.map-rsz-bl{cursor:nesw-resize;width:15px;height:15px}
.map-rsz:hover{background:rgba(216,178,90,.38);border-radius:4px}
@media (max-width:820px){
.map-rsz{display:none}
}
@media (max-width:820px){
.vtt-head{position:static;width:auto}
.map-repo{padding-top:10px}
}

/* ---- v1.71: full-width bubble, header row, zoom bar (Shaun, voice
   call 2026-11-07 ~13:05-13:17). The bubble (.page + #mapPanel) now
   stretches the FULL WIDTH of the screen, all the way to both edges.
   The header is a real row across that full width, same row: its
   buttons (Push to TV, Ambience) all the way to the LEFT, and the
   "APOC VTT" title + version tag together all the way at the RIGHT
   edge — this supersedes the v1.63 header-over-the-right-column
   placement and the v1.61 nesting of those buttons inside Tools.
   The Art Library no longer needs the 52px top pad that cleared the
   old absolute header. The map fit reserve grows 144 -> 196 for the
   header row so the closed page still fits one screen. ---- */
.page{width:100%;padding:0 4px 12px}
.vtt-head{position:static;width:auto;margin:0 0 6px;display:flex;align-items:center;flex-wrap:nowrap;gap:10px}
.vtt-head .head-btns{display:flex;gap:8px;align-items:center;flex:1 1 auto;justify-content:flex-start;min-width:0}
.vtt-head .head-title{display:flex;align-items:baseline;gap:10px;flex:none;margin-left:auto}
.vtt-head h1{font-size:2rem;white-space:nowrap}
.vtt-head .btn{min-height:40px}
.map-repo{padding-top:0}
.apoc-map{height:min(calc(100vh - 196px),980px)}
@media (max-width:820px){
.vtt-head{flex-wrap:wrap}
}
/* ---- v1.71: the zoom bar (Shaun: "the bar zoomer" — movable; its
   home gutter is under the map box, above the bottom Art Library
   strip — see the amendment note below). A slim floating bar
   straddling the map window's bottom-right corner; drag its ZOOM
   grip to park it anywhere over the stage, per-device persistence
   (see the zoom script at the end of the body); the slider zooms
   wherever it is parked. Hidden on the TV copy, in fullscreen and
   in Expand, like the resize handles. ---- */
#zoomBar{position:absolute;z-index:960;height:30px;padding:3px 8px;display:flex;flex-direction:row;align-items:center;gap:7px;background:rgba(10,12,16,.78);border:1px solid hsl(222 18% 30%);border-radius:10px}
#zoomBar[hidden]{display:none}
#zoomBar .zb-grip{cursor:grab;font-size:.62rem;font-weight:700;letter-spacing:.07em;color:#cfd3da;user-select:none;-webkit-user-select:none;touch-action:none;padding:2px 3px;line-height:1.1;text-align:center}
#zoomBar .zb-grip:active{cursor:grabbing}
#zoomBar input[type=range]{width:148px;height:22px;accent-color:#d8b25a;cursor:pointer;margin:0}
#zoomBar .zb-pinch{display:flex;align-items:center;gap:4px;font-size:.68rem;font-weight:700;letter-spacing:.05em;color:#cfd3da;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
#zoomBar .zb-pinch input{width:15px;height:15px;margin:0;accent-color:#d8b25a;cursor:pointer;flex:none}
body.displaying #zoomBar{display:none !important}
#mapPanel:fullscreen #zoomBar{display:none !important}
.map-stage:fullscreen #zoomBar{display:none !important}

/* ---- v1.71 (amendment, Shaun, voice call 2026-11-07 ~13:22): the
   ART LIBRARY lives ACROSS THE BOTTOM — a horizontal strip under
   the map stage, full width of the bubble, categories side by
   side. Its expanded body OVERLAYS upward over the map's bottom
   edge (opening downward would extend past the page end and
   create the very scroll this avoids) with its own internal
   scroll, keeping the map's fit rule and the one-screen
   closed page. The strip is the DEFAULT home: dragged by its grip
   it floats free (perimeter script, .per-float) and stays exactly
   where it is left; double-clicking the grip returns it here. ---- */
#mapPanel{position:relative}
#mapPanel > .map-repo{flex:none;width:100%;margin-top:10px}
.map-repo .artlib{position:relative}
.map-repo .artlib.open > .nest-body{position:absolute;bottom:calc(100% + 4px);left:0;right:0;z-index:1250;display:flex;flex-wrap:wrap;gap:10px;max-height:46vh;overflow-y:auto;background:rgba(10,12,16,.97);border:1px solid hsl(222 18% 28%);border-radius:10px;padding:10px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.map-repo .artlib.open > .nest-body > *{flex:1 1 230px;min-width:0;margin-top:0;margin-bottom:0}
.map-repo .mr-list{max-height:30vh}
.map-repo.per-float{position:absolute;z-index:1100;margin:0;max-height:64vh;overflow-y:auto;overflow-x:hidden}
.map-repo.per-float .artlib.open > .nest-body{position:static;max-height:38vh;box-shadow:none}

/* ---- v1.71: right-click options menu (Shaun, voice call
   2026-11-07 ~13:20) — one menu for everything placed on the map;
   see the context-menu script at the end of the body. ---- */
#ctxMenu{position:fixed;z-index:4000;min-width:190px;max-width:270px;background:rgba(10,12,16,.97);border:1px solid hsl(222 18% 32%);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:2px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
#ctxMenu[hidden]{display:none}
#ctxMenu .ctx-title{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground);padding:3px 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctxMenu button{text-align:left;background:transparent;border:0;color:inherit;font:inherit;font-size:.92rem;padding:7px 8px;border-radius:7px;cursor:pointer;min-height:34px}
#ctxMenu button:hover{background:rgba(216,178,90,.14);color:var(--primary)}
#ctxMenu button.danger:hover{color:#f0b1b1;background:rgba(160,40,40,.16)}

/* ---- v1.74 (Shaun, voice call 2026-11-07 ~13:46-13:49): the Art
   Library goes BACK on the right as a VERTICAL dock (superseding the
   v1.71 bottom strip), it renders ON TOP of everything, the page fits
   one screen with NO scrolling, open control sets OVERLAY the map
   instead of pushing the page taller, and the map-name dropdown gets
   two columns + a hover preview (see the scripts at the end). ---- */
/* The stage row: map column + a right column JUST wide enough for the
   library dock (300px — the width the dock has always used). The map
   box stays flush left and gives up exactly the dock's width. */
.stage-row{display:flex;gap:14px;align-items:stretch;width:100%;margin-top:12px}
.stage-row > .map-stage{flex:1 1 auto;min-width:0;margin-top:0}
.stage-row > .map-repo{flex:0 0 300px;width:300px;position:relative;z-index:3000;margin-top:0}
.stage-row > .map-repo.per-float{position:absolute} /* the float must beat the dock rule above (equal specificity, later sheet position) or a saved park renders as a relative nudge of the dock instead of a free float */
/* Fullscreen / Expand keep their pre-v1.74 structure: the wrapper
   vanishes from the layout and the old rules take over. */
body.map-expanded .stage-row{display:contents}
#mapPanel:fullscreen .stage-row{display:contents}
.map-repo > .place-card{max-height:320px;overflow-y:auto}
/* Library ON TOP: docked, its expanded body overlays LEFTWARD over the
   map — it never pushes, resizes or reflows anything outside itself.
   (When the library is floated, the v1.71 in-float rule below still
   governs; the float box itself is the overlay.) */
.map-repo:not(.per-float) .artlib.open > .nest-body{position:absolute;top:0;right:calc(100% + 8px);left:auto;bottom:auto;width:min(880px,74vw);max-height:min(80vh,760px);display:block;overflow-y:auto;overflow-x:hidden;background:rgba(10,12,16,.97);border:1px solid hsl(222 18% 28%);border-radius:10px;padding:10px;box-shadow:0 18px 44px rgba(0,0,0,.6);z-index:3100}
.map-repo:not(.per-float) .artlib.open > .nest-body > *{margin:0 0 10px}
.map-repo:not(.per-float) .artlib.open > .nest-body > *:last-child{margin-bottom:0}
/* Open sets OVERLAY: a set floats upward over the map from the button
   row instead of pushing the page taller — page geometry and scroll
   state never change when a set opens. Internal scroll only. */
.ctl-row{position:relative}
.ctl-set{position:absolute;bottom:calc(100% + 6px);left:0;right:0;max-height:66vh;overflow-y:auto;overflow-x:hidden;z-index:2900;background:rgba(13,16,21,.97);box-shadow:0 18px 44px rgba(0,0,0,.55);margin-top:0}
/* The map-name dropdown (custom, mirrors #mapSelect): the OS list
   cannot do two columns or hover previews, so the native select is
   kept as the data/value holder and this control renders instead. */
#mapSelect.mapselect-native-hidden{display:none}
.mapdd-btn{font:inherit;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid hsl(222 18% 30%);background:rgba(10,12,16,.6);color:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:38px}
.mapdd-btn .mapdd-cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapDdPanel{position:fixed;z-index:4500;background:#fff;color:#111;border:1px solid #8a8a8a;border-radius:8px;box-shadow:0 18px 44px rgba(0,0,0,.5);padding:6px;overflow-y:auto;max-height:62vh}
#mapDdPanel[hidden]{display:none}
#mapDdPanel .mapdd-grid{display:grid;grid-auto-flow:column;gap:1px 18px}
#mapDdPanel .mapdd-item{padding:5px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem;color:#111}
#mapDdPanel .mapdd-item:hover{background:#e8ecf3}
#mapDdPanel .mapdd-item.sel{font-weight:700;background:#dfe6f2}
#mapPreview{position:fixed;z-index:4600;background:#0b0d11;border:1px solid hsl(222 18% 32%);border-radius:10px;padding:8px;box-shadow:0 18px 44px rgba(0,0,0,.6);pointer-events:none}
#mapPreview[hidden]{display:none}
#mapPreview img{display:block;max-width:min(600px,44vw);max-height:60vh;border-radius:6px;background:#111}
#mapPreview .mp-name{color:#f3e2b3;font-size:.85rem;font-weight:700;padding:6px 2px 0;max-width:600px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body data-scene="bastion-streets">
<script>/* v1.07: Push to TV — a ?display copy of this page is the map-only TV view; flag it before first paint so no controls ever flash. */ if (new URLSearchParams(location.search).has("display")) document.body.classList.add("displaying");</script>
<div class="page">
  <header class="vtt-head">
    <div class="head-btns" id="headBtns"></div>
    <div class="head-title">
      <h1>APOC VTT</h1>

  <section class="panel" id="mapPanel" aria-label="The VTT — Maps">

        </div>
      </div>

    </div>
      <aside class="map-repo" aria-label="Art Library">
        <div id="placeCard" class="place-card" hidden></div>
        <div class="nest artlib" id="artLibrary">
          <button type="button" class="nest-head artlib-head" aria-expanded="false">Art Library</button>
          <div class="nest-body">
            <div class="lib-panel" id="tokenLib" hidden>
              <div class="nest">
                <button type="button" class="nest-head" aria-expanded="false">Symbols</button>
                <div class="nest-body"><div class="lib-grid" id="libSymbols"></div></div>
              </div>
              <div class="nest">
                <button type="button" class="nest-head" aria-expanded="false">Tokens — discs &amp; numbers</button>
                <div class="nest-body">
                  <div class="field" style="max-width:280px">
                    <label for="libName">Name for the next token (optional)</label>
                    <input id="libName" type="text" autocomplete="off" placeholder="e.g. Goblin 3">
                  </div>
                  <div class="lib-grid" id="libDiscs"></div>
                </div>
              </div>
              <div class="nest">
                <button type="button" class="nest-head" aria-expanded="false">Artwork — Saint James &amp; Cody's gallery</button>
                <div class="nest-body"><div class="lib-grid" id="libArt"></div></div>
              </div>
            </div>
            <div class="nest" id="monsterNest">

              <div class="nest-body">
                <div class="field" style="max-width:280px">
                  <label for="monsterSort">Sort monsters</label>
                  <select id="monsterSort">
                    <option value="alpha">Alphabetical</option>
                    <option value="crAsc">CR low → high</option>
                    <option value="crDesc">CR high → low</option>
                  </select>
                </div>
                <div id="libMonsters"><p class="muted small" id="monsterLibNote"></p></div>
                <div class="monster-detail" id="monsterDetail" hidden></div>
              </div>
            </div>
            <div class="lib-panel" id="mapRepo">
              <div class="nest" id="mapsNest">
                <button type="button" class="nest-head" aria-expanded="false"><span>Maps repository <span class="muted small" id="mapRepoCount"></span></span></button>
                <div class="nest-body">
                  <div class="field">
                    <label for="mapRepoSearch">Search maps</label>
                    <input id="mapRepoSearch" type="text" autocomplete="off" placeholder="Search the collection…">
                  </div>
                  <div class="mr-list" id="mapRepoList"></div>
                  <p class="muted small" id="mapRepoStatus"></p>
                </div>
              </div>
            </div>
            <div class="lib-panel" id="stampLib" hidden>
              <div class="nest" id="stampsNest">
                <button type="button" class="nest-head" aria-expanded="false">Stamps</button>
                <div class="nest-body"><div class="lib-grid" id="stampGrid"></div></div>
              </div>
            </div>
          </div>
        </div>
      </aside>
    <div class="map-tools">
      <div class="field">
        <input id="placeSearch" type="text" autocomplete="off" aria-label="Find a place" placeholder="Search — e.g. Silverymoon, Candlekeep, Waterdeep">

      </div>
      <button type="button" class="btn" id="addPlaceBtn" aria-pressed="false" hidden>Add place</button>

    <div class="map-tools" id="fogControls" hidden>

          <option value="">Off</option>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";
/* ================= The table's map: shared markers over the canon 3E Faerun map =================
   Markers are shared through the tracker's site_settings store (key "map_markers",
   value {markers:[{id,name,kind,x,y,note}]}) — the same shared backend as Campaign
   Status, so everybody sees the same map. x/y are percentages of the map image.
   (The entries table's category check does not allow a marker category, so markers
   deliberately do NOT live there.) */
(function(){
  const statusEl = { textContent: "" }, form = $("markerForm"); /* no status line on the page (removed at Shaun's order) — writes land on this stub */
  if (!window.L) { statusEl.textContent = "The map library could not load — check the connection and refresh."; return; }
  if (!db) { statusEl.textContent = "The shared store could not be reached, so markers can't load or save right now."; return; }
  let MW = 4763, MH = 3185;
  const markersKey = () => currentMapId === "faerun" ? "map_markers" : `map_markers_${currentMapId}`;
  let currentMapId = "faerun";
  const KINDS = ["city", "party", "place", "danger", "note", "ruin", "ghost", "dead", "altered"];
  const map = L.map("apocMap", { crs: L.CRS.Simple, minZoom: -2, maxZoom: 3, zoomSnap: 0.25, attributionControl: false, zoomControl: false, touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false }); /* v1.72/v1.73: every Leaflet zoom path off at creation (touch pinch, wheel, double-click, box, keyboard). Zoom comes from the zoom bar slider; the bar's Pinch checkbox (default OFF, per-device) can switch touch pinch / wheel / double-tap back on, live (Shaun's correction, 2026-11-07 ~13:39) */
  /* Shaun's fixed layer stack (2026-11-06), bottom to top:
     1 Map, 2 Tokens, 3 GM, 4 Light, 5 Foreground. Extensible in this
     order — new table layers take the next z slot above Foreground.
     (Leaflet's own popup/tooltip/control chrome keeps its stock panes
     above the stack; that is UI, not table material.) */
  for (const [paneName, z] of [["layerMap", 205], ["layerTokens", 300], ["layerGm", 400], ["layerLight", 500], ["layerForeground", 560]]) {
    map.createPane(paneName);
    map.getPane(paneName).style.zIndex = z;
    map.getPane(paneName).style.pointerEvents = "none";
  }
  let bounds = [[0, 0], [MH, MW]];
  let baseOverlay = L.imageOverlay("assets/maps/faerun-3e.webp", bounds, { pane: "layerMap" }).addTo(map);
  map.fitBounds([[MH * (1 - 0.34), MW * 0.02], [MH * (1 - 0.005), MW * 0.38]]);
  map.setMaxBounds([[-MH * 0.08, -MW * 0.08], [MH * 1.08, MW * 1.08]]);
  const layer = L.layerGroup().addTo(map);
  const veilLayer = L.layerGroup().addTo(map);
  function drawVeil(){
    veilLayer.clearLayers();
    veilLayer.addLayer(L.rectangle(bounds, { pane: "layerMap", color: "transparent", weight: 0, fillColor: "#767c86", fillOpacity: 0.16, interactive: false }));
  }
  drawVeil();
  $("apocMap").classList.add("apoc-on");
  $("apocToggle").addEventListener("change", ev => {
    $("apocMap").classList.toggle("apoc-on", ev.target.checked);
    if (ev.target.checked) veilLayer.addTo(map); else map.removeLayer(veilLayer);
  });
  /* v1.07: the ?display TV copy counts as projecting for every guard —
     player view only, no GM material, no editing — while never touching
     the laptop control copy's own screen. (v1.10: the old Project to TV
     button and its own-screen "projecting" mode are removed; Push to TV's
     ?display copy is the only projecting view, via the displaying class.) */
  const isProjecting = () => document.body.classList.contains("displaying");
  /* ---- Map rotation (Shaun, 2026-11-06): a Rotate map button turns the
     CURRENT map in 90° steps. Rotation is a VIEW transform applied inside
     the coordinate helpers below — every subsystem (tokens, fog, drawings,
     markers, places, walls/doors, dynamic lighting, grid) already converts
     through toLatLng / toXY / uToLatLng, so everything turns together and
     stays aligned by construction, and all stored data keeps its natural
     (unrotated) percent coords. The base map image and paint overlays are
     the only bitmaps; they are drawn rotated to match (see rotatedMapUrl /
     paintRotUrl). Rotation is per map and SHARED: it rides in the map's
     vtt_settings value, so the ?display=1 TV copy shows the same rotation
     and switching away and back restores it. ---- */
  let mapRot = 0; /* quarter turns clockwise: 0, 1, 2, 3 */
  const frameW = () => (mapRot % 2 ? MH : MW);
  const frameH = () => (mapRot % 2 ? MW : MH);
  const frameBounds = () => [[0, 0], [frameH(), frameW()]];
  function rotPct(x, y){ /* natural % -> frame % */
    if (mapRot === 1) return { x: 100 - y, y: x };
    if (mapRot === 2) return { x: 100 - x, y: 100 - y };
    if (mapRot === 3) return { x: y, y: 100 - x };
    return { x, y };
  }
  function unrotPct(x, y){ /* frame % -> natural % */
    if (mapRot === 1) return { x: y, y: 100 - x };
    if (mapRot === 2) return { x: 100 - x, y: 100 - y };
    if (mapRot === 3) return { x: 100 - y, y: x };
    return { x, y };
  }
  /* Rotate a latlng-space point between the natural frame and the view
     frame (used by the grid and the ruler snap, which work in raw latlng). */
  function llRot(lat, lng){ const f = rotPct(lng / MW * 100, (1 - lat / MH) * 100); return [frameH() * (1 - f.y / 100), frameW() * (f.x / 100)]; }
  function llUnrot(lat, lng){ const n = unrotPct(lng / frameW() * 100, (1 - lat / frameH()) * 100); return { lat: MH * (1 - n.y / 100), lng: MW * (n.x / 100) }; }
  const toLatLng = (x, y) => { const f = rotPct(x, y); return [frameH() * (1 - f.y / 100), frameW() * (f.x / 100)]; };
  const toXY = ll => { const n = unrotPct(ll.lng / frameW() * 100, (1 - ll.lat / frameH()) * 100); return { x: Math.round(n.x * 100) / 100, y: Math.round(n.y * 100) / 100 }; };
  const iconFor = (kind, name, temp, under) => L.divIcon({
    className: "mk-icon",
    html: `<div class="mk mk-${KINDS.includes(kind) ? kind : "place"}${temp ? " mk-temp" : ""}${under ? " mk-under" : ""}${under === 2 ? " mk-under2" : ""}"><span class="mk-dot"></span><span class="mk-label">${esc(name || "New marker")}</span></div>`,
    /* Explicit iconSize (marker-zoom fix, 2026-11-06): with no iconSize,
       Leaflet falls back to a 12px box for the icon element while the dot
       alone is 20px — every marker painted entirely as element overflow,
       which real browsers can drop at fractional zoom scales (markers
       vanished at full zoom-out). The box now contains the dot; the
       anchor is unchanged, so dots/labels sit exactly where they did. */
    iconSize: [20, 20],
    iconAnchor: [8, 8]
  });
  let markers = [];
  let editing = null;
  let tempPin = null;
  const newId = () => "m-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
  window.map = map; window.toXY = toXY; window.newId = newId;
  function setStatus(msg){ statusEl.textContent = msg; }
  function draw(){
    layer.clearLayers();
    /* Label collision pass: a marker whose name pill would run over the
       next marker's dot (Silverymoon over Sundabar) drops its pill BELOW
       its own dot instead. Positions are shared data — never moved. */
    const z = map.getZoom();
    const pts = markers.map(mk => { try { return map.project(toLatLng(mk.x, mk.y), z); } catch(e) { return { x: mk.x * 12, y: mk.y * 12 }; } });
    const pillW = mk => 40 + (String(mk.name || "").length * 6.3);
    markers.forEach(mk => { mk._under = false; });
    markers.forEach((mk, i) => {
      markers.forEach((o, j) => {
        if (i === j || o._under) return;
        if (pts[j].x > pts[i].x && pts[j].x - pts[i].x < pillW(mk) && Math.abs(pts[j].y - pts[i].y) < 20) o._under = true;
      });
    });
    /* Second pass: a dropped pill can still land inside the wide pill band
       of the marker it dropped for — Silverymoon's pill reaches across
       Sundabar, and the two sit at nearly the same height, so one band
       down was not clear (verified on the live page at v1.17). If a
       dropped pill's box still intersects any other marker's pill box,
       drop it a second band (mk-under2). Positions never move. */
    const labelBox = (idx, level) => {
      const p = pts[idx], w = pillW(markers[idx]);
      if (level === 2) return { x1: p.x - w / 2, x2: p.x + w / 2, y1: p.y + 36, y2: p.y + 56 };
      if (level === 1) return { x1: p.x - w / 2, x2: p.x + w / 2, y1: p.y + 12, y2: p.y + 32 };
      return { x1: p.x + 10, x2: p.x + 10 + w, y1: p.y - 10, y2: p.y + 10 };
    };
    const boxHit = (a, b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
    markers.forEach((mk, i) => {
      if (mk._under !== true) return;
      const mine = labelBox(i, 1);
      const clash = markers.some((o, j) => j !== i && boxHit(mine, labelBox(j, o._under ? 1 : 0)));
      if (clash) mk._under = 2;
    });
    for (const mk of markers) {
      /* GM-only markers (mk.gm — Roll20's hidden pins) are not rendered at
         all without GM view; projecting forces player view, so the TV copy
         never sees them either. */
      if (mk.gm && !effectiveGm()) continue;
      const kind = KINDS.includes(mk.kind) ? mk.kind : "place";
      const m = L.marker(toLatLng(mk.x, mk.y), { pane: "layerMap", draggable: true, icon: iconFor(kind, mk.name, false, mk._under) }).addTo(layer);
      m.on("click", () => {
        const imgs = Array.isArray(mk.imgs) ? mk.imgs.filter(Boolean) : [];
        if (isProjecting() || document.body.classList.contains("map-expanded")) { L.popup().setLatLng(m.getLatLng()).setContent(`<b>${esc(mk.name)}</b>${mk.note ? "<br>" + esc(mk.note) : ""}${imgs.length ? `<span class="pin-imgs">${imgs.map(u => `<img src="${esc(u)}" alt="">`).join("")}</span>` : ""}`).openOn(map); return; }
        if (imgs.length) { showPinCard(mk); return; }
        openEditor({ mode: "edit", mk });
      });
      m.on("dragend", async () => {
        const p = toXY(m.getLatLng()); mk.x = p.x; mk.y = p.y;
        setStatus(`Saving ${mk.name}'s new position\u2026`);
        const ok = await saveMarkers();
        if (ok) setStatus(`${mk.name} moved — saved for everybody.`);
        else { setStatus("That move didn't save — drag it again or refresh."); loadMarkers(true); }
      });
    }
    /* The new-marker temp pin lives on this same layer: a redraw (e.g. on
       zoom) clears it, so put it back — the editor state survives redraws. */
    if (tempPin) layer.addLayer(tempPin);
  }
  async function loadMarkers(quiet){
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", markersKey()).maybeSingle();
    if (error) { if (!quiet) setStatus("The shared markers could not be loaded — try again in a few seconds."); return; }
