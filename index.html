      if (scene === 'quests'){ if (Math.random() < 0.85) crackle(); if (Math.random() < 0.4) setTimeout(crackle, 90 + Math.random()*220); }
      else if (scene === 'time'){ tick(0.12, 1900); }
      else if (scene === 'journal' || scene === 'lore'){ if (Math.random() < 0.35) tick(0.05, 2600 + Math.random()*600); }
      else if (scene === 'world'){ windFilter.frequency.value = 520; }
      if (scene !== 'world' && windFilter) windFilter.frequency.value = 420;
    }, 1000);
  }
  function apply(){
    if (btn) { btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.textContent = on ? '🔊 Ambience on' : '🔇 Ambience off'; }
    document.body.classList.toggle('bg-animated', on);
    try { window.localStorage.setItem('livetracker:ambience', on ? '1' : '0'); } catch(e) {}
    if (on) startAudio();
    else if (ctx && master) master.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 0.6);
  }
  if (btn) btn.addEventListener('click', function(){ on = !on; apply(); });
  if (on) { document.body.classList.add('bg-animated'); if (btn) { btn.setAttribute('aria-pressed','true'); btn.textContent='🔊 Ambience on'; }
    var arm = function(){ startAudio(); window.removeEventListener('pointerdown', arm); window.removeEventListener('keydown', arm); };
    window.addEventListener('pointerdown', arm); window.addEventListener('keydown', arm); }
})();
</script>

<script>
"use strict";
/* ================= v1.08: Maps repository =================
   A browsable shelf for EVERY saved map, inside the right-edge
   repository rail. Built-ins (Faerûn, Saint James) sit at the top,
   protected from removal. Everything else rides the existing shared
   vtt_dropmaps registry (dropMaps / saveDropRegistry) and the
   cody-artwork bucket — the library collection (lib-* records,
   uploaded at full original resolution with thumbs under
   vtt-maps/thumbs/) and table-dropped maps (drop-*) alike, so the
   shelf is identical on every screen and every map keeps its
   per-map VTT state, projection and Push-to-TV display. */
(function(){
  /* v1.11: nested Art Library headers — ONE delegated toggle for every
     .nest-head on the page (static rail sections, Stamps, and the
     dynamic map-folder groups built by render() alike). A header tap
     expands/collapses its own nest only. Registered here, outside the
     listEl guard, so it covers the whole rail. */
  document.addEventListener("click", function(e){
    var h = e.target && e.target.closest ? e.target.closest(".nest-head") : null;
    if (!h) return;
    var nest = h.parentElement;
    if (!nest || !nest.classList.contains("nest")) return;
    var open = nest.classList.toggle("open");
    h.setAttribute("aria-expanded", open ? "true" : "false");
  });
  var listEl = document.getElementById("mapRepoList");
  if (!listEl) return;
  var countEl = document.getElementById("mapRepoCount");
  var statusEl = document.getElementById("mapRepoStatus");
  var searchEl = document.getElementById("mapRepoSearch");
  var FOLDERS = { "arkenforge": "Arkenforge", "my-campaign-a-maps": "Campaign maps",
    "dungeon-alchemist-onedrive": "Dungeon Alchemist", "dropbox-maps": "Dropbox maps",
    "dropbox-transfer-unique": "Dropbox transfer", "loose": "Loose maps", "gen": "Generated maps", "drop": "Dropped at the table" };
  /* v1.65: Roll20 folder emulation (Shaun 2026-11-07 — "emulate the
     folder system that Roll20 has and put all the maps in the proper
     folders like it is in Roll20"). A registry rec carrying an r20
     assignment — { f: folder name (null = Roll20's unfiled top level),
     s: subfolder name or null, i: the page's order index } — files
     into Roll20's own tree: the 7 folders in Roll20 order with Roll20
     names, subfolders nested, Roll20 page order kept inside each
     folder. Recs without r20 keep their source-collection folders
     below the tree. Assignments are matched by name against the
     recorded Roll20 page list (roll20-folders.json); nothing is
     force-fit. */
  var R20_TREE = [
    { name: "The sphere cosmotalogy", subs: [] },
    { name: "The bastion", subs: ["Fire Fire", "New Folder 1"] },
    { name: "Brightstone", subs: [] },
    { name: "Formian hive nest", subs: [] },
    { name: "ships", subs: [] },
    { name: "Undermountain compact", subs: [] },
    { name: "pre start", subs: [] }
  ];
  var BUILTINS = [
    { id: "faerun", name: "Faerûn — World Map", thumb: "assets/maps/faerun-3e.webp", w: 4763, h: 3185 },
    { id: "saint-james", name: "Arcanic Rendez-Vous — Saint James's floors", thumb: "assets/maps/saint-james-floors.webp", w: 1662, h: 1077 }
  ];
  var lastSig = "", filter = "";
  /* v1.13 perf: the shelf used to build all 816 rows (and 816 <img>
     elements) into collapsed nests on every render — that DOM weight
     was the slow repository load. Now render() builds only folder
     headers + counts from the in-memory registry; a folder's rows are
     built on first expansion and cached (keyed by the group's item
     signature) so collapse/re-expand and unrelated re-renders never
     rebuild them. The registry itself is the shared in-memory
     dropMaps array — expanding a folder never refetches it. */
  var rowEls = {};
  var groupState = {};
  function pub(path){ return "https://gjvebpbxggmumtslidej.supabase.co/storage/v1/object/public/cody-artwork/" + path; }
  function loadMap(id){
    var sel = document.getElementById("mapSelect");
    if (!sel) return;
    if (!window.__apocShelf || !window.__apocShelf.def(id)) { statusEl.textContent = "That map is still loading — try again in a moment."; return; }
    sel.value = id;
    sel.dispatchEvent(new Event("change"));
    statusEl.textContent = "";
    render(true);
  }
  async function removeMap(rec){
    var def = window.__apocShelf ? window.__apocShelf.def(rec.id) : null;
    var nm = rec.name || (def && def.name) || rec.id;
    if (!confirm("Remove the map \"" + nm + "\" from the repository? It leaves the shelf for everybody; its tokens, fog and drawings stay in the shared store under its key.")) return;
    if (window.__apocShelf) { window.__apocShelf.setRecs(window.__apocShelf.recs().filter(function(m){ return m.id !== rec.id; })); await window.__apocShelf.saveRegistry(); }
    var paths = [rec.path, rec.thumb].filter(Boolean);
    if (paths.length && window.__apocShelf) await window.__apocShelf.removeFiles(paths);
    var sel = document.getElementById("mapSelect");
    var opt = sel && sel.querySelector("option[value=\"" + rec.id + "\"]");
    if (opt) opt.remove();
    if (window.__apocShelf) window.__apocShelf.delDef(rec.id);
    if (window.__apocShelf) window.__apocShelf.idbDel(rec.id);
    if (window.__apocShelf && window.__apocShelf.current() === rec.id) await window.__apocShelf.loadFaerun();
    lastSig = "";
    render(true);
    statusEl.textContent = "\"" + nm + "\" removed from the repository.";
  }
  /* v1.65: move-to-folder control on registry rows — the Roll20 tree,
     Top level, or back to a source-collection folder. Persists through
     the same shelf save path as Remove. */
  function moveDestinations(){
    var out = [];
    R20_TREE.forEach(function(F){
      out.push({ label: "📁 " + F.name, r20: { f: F.name, s: null } });
      F.subs.forEach(function(s){ out.push({ label: "📁 " + F.name + " › " + s, r20: { f: F.name, s: s } }); });
    });
    out.push({ label: "📄 Top level (Roll20 unfiled)", r20: { f: null, s: null } });
    Object.keys(FOLDERS).forEach(function(k){ out.push({ label: "🗂 " + FOLDERS[k], src: k }); });
    return out;
  }
  function openMoveMenu(row, rec){
    if (row.querySelector(".mr-move-sel")) return;
    var dests = moveDestinations();
    var sel = document.createElement("select");
    sel.className = "mr-move-sel";
    var cur = document.createElement("option");
    cur.textContent = "Move to…"; cur.value = ""; sel.appendChild(cur);
    dests.forEach(function(d, ix){
      var op = document.createElement("option");
      op.value = String(ix); op.textContent = d.label; sel.appendChild(op);
    });
    sel.addEventListener("click", function(ev){ ev.stopPropagation(); });
    sel.addEventListener("change", async function(){
      var v = sel.value;
      sel.remove();
      if (v === "") return;
      var d = dests[Number(v)];
      if (!d) return;
      if (d.src) { delete rec.r20; rec.folder = d.src; }
      else { rec.r20 = { f: d.r20.f, s: d.r20.s, i: 1000000 + (Date.now() % 100000) }; }
      if (window.__apocShelf) { window.__apocShelf.setRecs(window.__apocShelf.recs()); await window.__apocShelf.saveRegistry(); }
      lastSig = "";
      render(true);
      statusEl.textContent = "\"" + (rec.name || rec.id) + "\" moved to " + d.label.replace(/^[^\w]+/, "") + ".";
    });
    row.appendChild(sel);
    sel.focus();
  }
  function itemRow(o){
    var row = document.createElement("div");
    row.className = "mr-item" + ((window.__apocShelf && window.__apocShelf.current() === o.id) ? " mr-current" : "");
    var img = document.createElement("img");
    img.loading = "lazy"; img.decoding = "async"; img.alt = "";
    img.src = o.thumbUrl;
    var meta = document.createElement("span"); meta.className = "mr-meta";
    var nm = document.createElement("span"); nm.className = "mr-name"; nm.textContent = o.name;
    var sub = document.createElement("span"); sub.className = "mr-sub";
    sub.textContent = (o.w && o.h) ? (o.w + "×" + o.h + (o.note ? " · " + o.note : "")) : (o.note || "");
    meta.appendChild(nm); meta.appendChild(sub);
    row.appendChild(img); row.appendChild(meta);
    row.dataset.mapId = o.id;
    rowEls[o.id] = row;
    row.title = "Load \"" + o.name + "\" in the VTT";
    row.addEventListener("click", function(){ loadMap(o.id); });
    if (o.rec) {
      var mv = document.createElement("button");
      mv.type = "button"; mv.className = "mr-move"; mv.textContent = "→";
      mv.title = "Move this map to another folder";
      mv.setAttribute("aria-label", "Move " + o.name + " to another folder");
      mv.addEventListener("click", function(ev){ ev.stopPropagation(); openMoveMenu(row, o.rec); });
      row.appendChild(mv);
      var del = document.createElement("button");
      del.type = "button"; del.className = "mr-del"; del.textContent = "✕";
      del.title = "Remove this map from the repository";
      del.setAttribute("aria-label", "Remove " + o.name);
      del.addEventListener("click", function(ev){ ev.stopPropagation(); removeMap(o.rec); });
      row.appendChild(del);
    }
    return row;
  }
  /* v1.11: each folder group renders as a nested header (minimized by
     default; a live search auto-expands the groups that hold matches). */
  function groupNest(title, startOpen){
    var wrap = document.createElement("div");
    wrap.className = "nest mr-nest" + (startOpen ? " open" : "");
    var h = document.createElement("button");
    h.type = "button"; h.className = "nest-head mr-folder-head";
    h.setAttribute("aria-expanded", startOpen ? "true" : "false");
    h.textContent = title;
    var body = document.createElement("div");
    body.className = "nest-body mr-body";
    wrap.appendChild(h); wrap.appendChild(body);
    return { wrap: wrap, body: body };
  }
  function recRow(r){
    return itemRow({
      id: r.id, name: r.name || r.id,
      thumbUrl: r.thumb ? pub(r.thumb) : pub(r.path),
      w: r.w, h: r.h,
      note: r.thumb_only ? "thumbnail copy — full size not in the collection" : "",
      rec: r
    });
  }
  function buildGroupRows(items){
    var box = document.createElement("div");
    items.forEach(function(r){ box.appendChild(recRow(r)); });
    return box;
  }
  /* First expansion of a lazy folder builds its rows (capture phase:
     runs before the delegated .nest-head toggle opens the nest, so the
     rows are in place as it opens). */
  listEl.addEventListener("click", function(e){
    var h = e.target && e.target.closest ? e.target.closest(".mr-folder-head") : null;
    if (!h) return;
    var nest = h.parentElement;
    if (!nest || nest.classList.contains("open")) return;
    var body = nest.querySelector(":scope > .mr-body");
    if (!body || !body._lazy) return;
    var st = groupState[body._lazy];
    body._lazy = null;
    if (!st || st.built) return;
    st.content = st.build ? st.build() : buildGroupRows(st.items);
    st.built = true;
    body.appendChild(st.content);
  }, true);
  function render(force){
    var recs = (window.__apocShelf && window.__apocShelf.recs()) || [];
    var sig = recs.length + "|" + recs.map(function(r){ return r.id + (r.r20 ? "@" + (r.r20.f || "-") + "/" + (r.r20.s || "-") + "/" + (r.r20.i || 0) : ""); }).join(",") + "|" + (window.__apocShelf ? window.__apocShelf.current() : "") + "|" + filter;
    if (!force && sig === lastSig) return;
    lastSig = sig;
    var f = filter.trim().toLowerCase();
    var match = function(n){ return !f || n.toLowerCase().indexOf(f) >= 0; };
    listEl.innerHTML = "";
    var shown = 0;
    var bNest = groupNest("Built-in maps", !!f); var bCount = 0;
    BUILTINS.forEach(function(b){
      if (!match(b.name)) return;
      bNest.body.appendChild(itemRow({ id: b.id, name: b.name, thumbUrl: b.thumb, w: b.w, h: b.h, note: "built-in" })); bCount++;
    });
    if (bCount) { listEl.appendChild(bNest.wrap); shown += bCount; }
    /* v1.65: partition — recs with an r20 assignment file into the
       Roll20 tree (folders in Roll20 order, subfolders nested, page
       order kept; Roll20's unfiled pages as a Top level group); the
       rest keep their source-collection folders below the tree. */
    var r20ByF = {}, r20TopAll = [], srcGroups = {};
    R20_TREE.forEach(function(F){
      r20ByF[F.name] = { direct: [], subs: {} };
      F.subs.forEach(function(s){ r20ByF[F.name].subs[s] = []; });
    });
    recs.forEach(function(r){
      if (r.r20 && typeof r.r20 === "object") {
        if (r.r20.f == null) { r20TopAll.push(r); return; }
        var slot = r20ByF[r.r20.f];
        if (slot) {
          if (r.r20.s && slot.subs[r.r20.s]) slot.subs[r.r20.s].push(r); else slot.direct.push(r);
          return;
        }
      }
      var g = r.id.indexOf("drop-") === 0 ? "drop" : (r.folder || "drop");
      (srcGroups[g] = srcGroups[g] || []).push(r);
    });
    var byR20 = function(a, b){ return ((a.r20.i || 0) - (b.r20.i || 0)) || (a.name || "").localeCompare(b.name || ""); };
    var liveGroups = {};
    function emitLazy(key, title, rows){
      /* rows: the rows to show (already filtered + sorted). Lazy in
         normal browsing; built eagerly while a search is active. */
      liveGroups[key] = true;
      var gn = groupNest(title + " (" + rows.length + ")", !!f);
      if (f) {
        gn.body.appendChild(buildGroupRows(rows));
      } else {
        var isig = rows.map(function(r){ return r.id; }).join(",");
        var st = groupState[key];
        if (st && st.built && st.sig === isig) {
          gn.body.appendChild(st.content);
        } else {
          groupState[key] = { sig: isig, built: false, items: rows, content: null };
          gn.body._lazy = key;
        }
      }
      listEl.appendChild(gn.wrap);
      shown += rows.length;
      return gn;
    }
    function emitR20Folder(F){
      var slot = r20ByF[F.name];
      var directAll = slot.direct.slice().sort(byR20);
      var subsAll = F.subs.map(function(s){ return { name: s, all: slot.subs[s].slice().sort(byR20) }; });
      if (f) {
        var direct = directAll.filter(function(r){ return match(r.name || r.id); });
        var subs = subsAll.map(function(sd){ return { name: sd.name, items: sd.all.filter(function(r){ return match(r.name || r.id); }) }; });
        var tot = direct.length + subs.reduce(function(n, sd){ return n + sd.items.length; }, 0);
        if (!tot) return;
        liveGroups["r20:" + F.name] = true;
        var gn = groupNest(F.name + " (" + tot + ")", true);
        subs.forEach(function(sd){
          if (!sd.items.length) return;
          var sn = groupNest(sd.name + " (" + sd.items.length + ")", true);
          sn.body.appendChild(buildGroupRows(sd.items));
          gn.body.appendChild(sn.wrap);
          shown += sd.items.length;
        });
        if (direct.length) { gn.body.appendChild(buildGroupRows(direct)); shown += direct.length; }
        listEl.appendChild(gn.wrap);
        return;
      }
      var totAll = directAll.length + subsAll.reduce(function(n, sd){ return n + sd.all.length; }, 0);
      var key = "r20:" + F.name;
      liveGroups[key] = true;
      var gn2 = groupNest(F.name + " (" + totAll + ")", false);
      var isig = directAll.map(function(r){ return r.id; }).join(",") + "|" + subsAll.map(function(sd){ return sd.name + ":" + sd.all.map(function(r){ return r.id; }).join(","); }).join("|");
      var st = groupState[key];
      if (st && st.built && st.sig === isig) {
        gn2.body.appendChild(st.content);
      } else {
        groupState[key] = { sig: isig, built: false, items: null, content: null, build: function(){
          var box = document.createElement("div");
          subsAll.forEach(function(sd){
            var sn = groupNest(sd.name + " (" + sd.all.length + ")", false);
            sn.body.appendChild(buildGroupRows(sd.all));
            box.appendChild(sn.wrap);
          });
          if (directAll.length) box.appendChild(buildGroupRows(directAll));
          return box;
        } };
        gn2.body._lazy = key;
      }
      listEl.appendChild(gn2.wrap);
    }
    R20_TREE.forEach(emitR20Folder);
    var topItems = r20TopAll.slice().sort(byR20).filter(function(r){ return match(r.name || r.id); });
    if (topItems.length) emitLazy("r20top", "Top level", topItems);
    Object.keys(srcGroups).sort(function(a, b){ return (FOLDERS[a] || a).localeCompare(FOLDERS[b] || b); }).forEach(function(g){
      var all = srcGroups[g].slice().sort(function(a, b){ return (a.name || "").localeCompare(b.name || ""); });
      var items = all.filter(function(r){ return match(r.name || r.id); });
      if (!items.length) return;
      emitLazy(g, FOLDERS[g] || g, f ? items : all);
    });
    Object.keys(groupState).forEach(function(g){ if (!liveGroups[g]) delete groupState[g]; });
    /* Prune row handles for rows not in the DOM, then refresh the
       current-map highlight on the ones that are. */
    var inDom = {};
    listEl.querySelectorAll(".mr-item").forEach(function(el){
      if (el.dataset.mapId) inDom[el.dataset.mapId] = true;
    });
    Object.keys(rowEls).forEach(function(id){ if (!inDom[id]) delete rowEls[id]; });
    Object.keys(rowEls).forEach(function(id){
      rowEls[id].classList.toggle("mr-current", window.__apocShelf && id === window.__apocShelf.current());
    });
    if (!shown) listEl.innerHTML = "<p class=\"muted small\">No maps match.</p>";
    if (countEl) countEl.textContent = "— " + (BUILTINS.length + recs.length) + " maps";
  }
  var deb = null;
  if (searchEl) searchEl.addEventListener("input", function(){
    clearTimeout(deb);
    deb = setTimeout(function(){
      filter = searchEl.value || "";
      if (filter.trim()) {
        ["artLibrary", "mapsNest"].forEach(function(id){
          var n = document.getElementById(id);
          if (n && !n.classList.contains("open")) {
            n.classList.add("open");
            var hd = n.querySelector(":scope > .nest-head");
            if (hd) hd.setAttribute("aria-expanded", "true");
          }
        });
      }
      render(true);
    }, 150);
  });
  render(true);
  setInterval(function(){ render(false); }, 3000);
})();
</script>

<script>
"use strict";
/* ================= Monster repository — Monster Manual I (DM material) =================
   Shaun's DM monster shelf, inside Art Library > Monsters. GM-ONLY
   contents: hidden entirely on the ?display TV copy; on the control
   page the header stays visible labelled "GM view only" while GM view
   is off (so the shelf is always findable), the body stays hidden, and
   the registry is not even fetched until GM view is first switched on.
   Data: shared site_settings key "vtt_monsters" (mirrors the
   vtt_dropmaps pattern) — { monsters: [{ slug, name, type, typeLine,
   cr, crNum, status: "found"|"generated"|"none", path, desc, flags }] }.
   Art lives in the cody-artwork bucket under vtt-monsters/ at 512x512.
   Layout per Shaun's spec: grouped BY creature type under type
   sub-headers (types A-Z), monsters A-Z within a type; a sort toggle
   re-orders within types — Alphabetical / CR low-high / CR high-low
   (fractional CRs numeric, no-CR last in both CR directions). Groups
   build their rows lazily on first expansion (the v1.13 maps fix), and
   thumbnails are loading="lazy", so the shelf never slows the page.
   Tap a monster = place its token at the map centre; drag it onto the
   map = place at the drop point — same tokens as Symbols/Artwork.
   The (i) on a tile opens its detail: description, CR, APOC flags, and
   whether the art is book art (enhanced) or generated. */
(function(){
  var nest = document.getElementById("monsterNest");
  var box = document.getElementById("libMonsters");
  if (!nest || !box) return;
  var countEl = document.getElementById("monsterCount");
  var sortEl = document.getElementById("monsterSort");
  var detailEl = document.getElementById("monsterDetail");
  var bodyEl = nest.querySelector(":scope > .nest-body");
  var FLAG_LABELS = {
    "summoning-does-not-work": "Summoning doesn\u2019t work in the APOC",
    "planar-travel-severed": "Planar travel is severed \u2014 it can\u2019t be called or reached from here",
    "drow-do-not-exist": "Drow no longer exist \u2014 the whole race became demons",
    "tieflings-do-not-exist": "Tieflings do not exist in the APOC"
  };
  var SIZE_TOKENS = { "Fine": 0.5, "Diminutive": 0.5, "Tiny": 0.5, "Small": 1, "Medium": 1, "Medium-size": 1, "Large": 2, "Huge": 3, "Gargantuan": 4, "Colossal": 4 };
  var monsters = [], bySlug = {}, started = false, sortMode = "alpha";
  var groupState = {};
  function pub(path){ return "https://gjvebpbxggmumtslidej.supabase.co/storage/v1/object/public/cody-artwork/" + path; }
  function gmOn(){
    try { if (typeof effectiveGm === "function") return !!effectiveGm(); } catch(e) {}
    /* Fallback if the main script's exposure ever goes missing again:
       read the GM button's own pressed state — applyGmUi keeps it true
       exactly while GM view is on. */
    var b = document.getElementById("gmBtn");
    return !!(b && b.getAttribute("aria-pressed") === "true");
  }

  /* GM gate — poll like the token-light field does. On the TV copy the
     nest does not exist at all. On the control page the HEADER stays
     visible with GM view off (labelled "GM view only", body hidden,
     registry not fetched) so the repository is always findable; the
     contents appear only with GM view on. */
  function gate(){
    var gm = gmOn();
    if (document.body.classList.contains("displaying")) { nest.style.display = "none"; return; }
    nest.style.display = "";
    if (bodyEl) bodyEl.style.display = gm ? "" : "none";
    if (!gm && countEl) countEl.textContent = "\u2014 GM view only";
    if (gm && !started) { started = true; loadRegistry(); }
  }
  gate();
  setInterval(gate, 700);

  async function loadRegistry(){
    var note = document.getElementById("monsterLibNote");
    try {
      if (!db) throw new Error("no db");
      var res = await db.from(SETTINGS_TABLE).select("value").eq("key", "vtt_monsters").maybeSingle();
      if (res.error) throw res.error;
      monsters = (res.data && res.data.value && Array.isArray(res.data.value.monsters)) ? res.data.value.monsters : [];
    } catch(e) { monsters = []; }
    bySlug = {};
    monsters.forEach(function(m){ bySlug[m.slug] = m; });
    if (countEl) countEl.textContent = monsters.length ? "\u2014 " + monsters.length + " monsters" : "";
    if (note) note.textContent = monsters.length ? "" : "The monster repository is empty \u2014 the registry read came back with nothing.";
    render();
  }

  function sortedWithin(list){
    var arr = list.slice();
    if (sortMode === "alpha") arr.sort(function(a, b){ return a.name.localeCompare(b.name); });
    else {
      var dir = sortMode === "crAsc" ? 1 : -1;
      arr.sort(function(a, b){
        var an = (typeof a.crNum === "number") ? a.crNum : null;
        var bn = (typeof b.crNum === "number") ? b.crNum : null;
        if (an === null && bn === null) return a.name.localeCompare(b.name);
        if (an === null) return 1;   /* no-CR last in BOTH directions */
        if (bn === null) return -1;
        if (an !== bn) return (an - bn) * dir;
        return a.name.localeCompare(b.name);
      });
    }
    return arr;
  }

  function groupNest(title){
    var wrap = document.createElement("div");
    wrap.className = "nest mr-nest";
    var h = document.createElement("button");
    h.type = "button"; h.className = "nest-head mr-folder-head";
    h.setAttribute("aria-expanded", "false");
    h.textContent = title;
    var body = document.createElement("div");
    body.className = "nest-body mr-body";
    wrap.appendChild(h); wrap.appendChild(body);
    return { wrap: wrap, body: body };
  }

  function itemEl(m){
    var d = document.createElement("div");
    d.className = "lib-item";
    d.dataset.slug = m.slug;
    d.dataset.name = m.name;
    if (m.tokenPath) d.dataset.img = pub(m.tokenPath); else if (m.path) d.dataset.img = pub(m.path);
    d.title = m.name + " \u2014 CR " + m.cr + ". Tap to place on the map, drag to drop it in place, (i) for details.";
    if (m.path) {
      var img = document.createElement("img");
      img.loading = "lazy"; img.decoding = "async"; img.alt = m.name;
      img.src = pub(m.path);
      d.appendChild(img);
    } else {
      var disc = document.createElement("span");
      disc.className = "mon-none";
      disc.textContent = (m.name || "?").charAt(0);
      disc.title = "No art \u2014 template entry";
      d.appendChild(disc);
    }
    var cap = document.createElement("span"); cap.className = "lib-cap";
    cap.textContent = m.name;
    var cr = document.createElement("span"); cr.className = "mon-cr";
    cr.textContent = "CR " + m.cr;
    cap.appendChild(cr);
    d.appendChild(cap);
    if (m.status === "generated") {
      var badge = document.createElement("span");
      badge.className = "mon-badge"; badge.textContent = "generated";
      badge.title = "Art generated from the book description \u2014 no book art was found";
      d.appendChild(badge);
    }
    var info = document.createElement("span");
    info.className = "mon-info"; info.textContent = "\u24d8";
    info.title = "Details \u2014 " + m.name;
    info.setAttribute("role", "button");
    info.addEventListener("click", function(ev){ ev.stopPropagation(); showDetail(m); });
    info.addEventListener("pointerdown", function(ev){ ev.stopPropagation(); });
    d.appendChild(info);
    d.addEventListener("click", function(){ placeMonster(m, null); });
    return d;
  }

  function buildRows(items){
    var grid = document.createElement("div");
    grid.className = "lib-grid";
    items.forEach(function(m){ grid.appendChild(itemEl(m)); });
    return grid;
  }

  /* Lazy build on first expansion — capture phase, same as the maps
     shelf: rows exist by the time the nest opens. */
  box.addEventListener("click", function(e){
    var h = e.target && e.target.closest ? e.target.closest(".mr-folder-head") : null;
    if (!h) return;
    var n = h.parentElement;
    if (!n || n.classList.contains("open")) return;
    var body = n.querySelector(":scope > .mr-body");
    if (!body || !body._lazy) return;
    var st = groupState[body._lazy];
    body._lazy = null;
    if (!st || st.built) return;
    st.content = buildRows(st.items);
    st.built = true;
    body.appendChild(st.content);
  }, true);

  function render(){
    groupState = {};
    box.innerHTML = "";
    var groups = {};
    monsters.forEach(function(m){ (groups[m.type] = groups[m.type] || []).push(m); });
    Object.keys(groups).sort(function(a, b){ return a.localeCompare(b); }).forEach(function(t){
      var items = sortedWithin(groups[t]);
      var gn = groupNest(t + " (" + items.length + ")");
      groupState[t] = { built: false, items: items, content: null };
      gn.body._lazy = t;
      box.appendChild(gn.wrap);
    });
    if (!monsters.length) box.innerHTML = "<p class=\"muted small\">The monster repository is empty \u2014 the registry read came back with nothing.</p>";
  }

  if (sortEl) sortEl.addEventListener("change", function(){ sortMode = sortEl.value; render(); });

  function showDetail(m){
    if (!detailEl) return;
    var flags = (m.flags || []).map(function(f){
      return "<span class=\"mon-flag\">" + esc(FLAG_LABELS[f] || f) + "</span>";
    }).join("");
    var art = m.status === "generated"
      ? "Art: generated from the book description (no book art found) \u2014 flagged as generated."
      : (m.status === "found" ? "Art: book art, enhanced; the original is preserved."
      : "Art: none \u2014 this is a template entry, listed without art rather than given an invented picture.");
    detailEl.innerHTML = "<h4>" + esc(m.name) + "</h4>"
      + "<p class=\"muted small\">" + esc(m.typeLine) + " \u00b7 CR " + esc(m.cr) + " \u00b7 " + esc((m.books && m.books.length) ? m.books.join(", ") : "Monster Manual I") + "</p>"
      + (flags ? "<p>" + flags + "</p>" : "")
      + "<p>" + esc(m.desc || "") + "</p>"
      + "<p class=\"muted small\">" + art + "</p>"
      + (m.tokenPath ? "<p class=\"muted small\"><img src=\"" + pub(m.tokenPath) + "\" alt=\"" + esc(m.name) + " token\" loading=\"lazy\" style=\"width:96px;height:96px;object-fit:contain;vertical-align:middle;margin-right:8px\">Token (placed on the map): " + esc(m.tokenSource || "") + (m.tokenFile ? " \u00b7 " + esc(m.tokenFile) : "") + (m.tokenNote ? " \u00b7 " + esc(m.tokenNote) : "") + (m.tokenLicense ? "<br>" + esc(m.tokenLicense) : "") + "</p>" : "<p class=\"muted small\">Token: none yet \u2014 placing uses the portrait art.</p>");
    detailEl.hidden = false;
    detailEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function placeMonster(m, at){
    if (!gmOn()) return;
    var tk;
    if (at) {
      tk = { id: newId(), name: m.name, x: at.x, y: at.y, size: 1, color: "red", hp: null, maxHp: null, img: "", sym: "", status: [], entryId: "" };
    } else {
      var c = toXY(map.getCenter());
      var off = (tokens.length % 5) * 1.5;
      tk = { id: newId(), name: m.name, x: Math.min(98, c.x + off), y: Math.min(98, c.y + off), size: 1, color: "red", hp: null, maxHp: null, img: "", sym: "", status: [], entryId: "" };
    }
    var sz = SIZE_TOKENS[String(m.typeLine || "").split(" ")[0]];
    if (sz) tk.size = sz;
    if (m.tokenPath) tk.img = pub(m.tokenPath); else if (m.path) tk.img = pub(m.path);
    tokens.push(tk);
    saveTokens().then(function(ok){
      drawTokens();
      tokenStatusEl.textContent = ok ? "\"" + tk.name + "\" placed \u2014 drag it into place." : "That token didn\u2019t save \u2014 try again.";
      if (!ok) loadTokens(true);
    });
  }

  /* Drag from the shelf onto the map — the same libDrag the token
     repository uses (pointer events, ghost, drop point in map %). */
  if (typeof libDrag === "function") {
    libDrag(box, function(b, p){
      var m = bySlug[b.dataset.slug];
      if (m) placeMonster(m, p);
    });
  }
})();
</script>

<script>
/* v1.60 — one row of buttons under the map (Shaun, voice call 2026-11-06
   ~23:29–23:31): "I want a row of buttons under the map. And each button
   has nested within it different sets of controls." + "everything's sets
   as collapsed into each one of those buttons."
   This script runs BEFORE the perimeter script: it gathers every control
   group that used to sit (parked, floating, scattered) below the map into
   ONE row placed directly under the stage. Each row button opens its set
   nested under the row (accordion: opening one closes the others) and
   EVERY set starts COLLAPSED on every load — no open state is stored.
   The row sits in page flow; because the groups are no longer direct
   children of #mapPanel, the perimeter script finds only the Art Library
   dock, and the fullscreen rail script finds no loose groups to move.
   Nothing is cloned: every control keeps its own handlers and state.
   The Token repository button below the map was removed at Shaun's order
   (~23:25) — the Art Library stands on its own in its dock beside the map.
   The Fog and Lighting row buttons exist only while GM view is on (their
   panels are GM-only) — applyGmUi() hides/shows the tabs with the panels. */
(function () {
  "use strict";
  var panel = document.getElementById("mapPanel");
  if (!panel) return;
  var stage = panel.querySelector(":scope > .map-stage");
  if (!stage) return;
  var $ = function (id) { return document.getElementById(id); };
  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text != null) el.textContent = text;
    return el;
  }
  function moveKids(from, to) {
    if (!from || !to) return;
    while (from.firstChild) to.appendChild(from.firstChild);
  }
  /* Drop the perimeter dressing (parked/collapsible classes, drag grip) so
     a re-homed group renders as a plain block inside its set. */
  function cleanSlate(root) {
    if (!root) return;
    root.classList.remove("per-group", "per-parked", "per-collapsible", "per-collapsed");
    root.removeAttribute("data-per");
    var grip = root.querySelector(":scope > .per-grip");
    if (grip) grip.remove();
  }
  function fieldOf(el) { if (!el || !el.closest) return el; return el.closest(".field") || el.closest("label") || el; }

  var row = mk("div", "ctl-row"); row.id = "ctlRow";
  var bar = mk("div", "ctl-bar"); row.appendChild(bar);
  stage.insertAdjacentElement("afterend", row);

  /* GM view stays a DIRECT button in the row (hold-to-switch, v1.59); its
     status line rides along with it. v1.67 (Shaun): the button sits next
     to Dice — it is appended AFTER the tabs loop below, so it lands at
     the end of the bar, immediately after the Dice tab. */
  var gmBtn = $("gmBtn"), gmStatus = $("gmStatus");

  var ORDER = ["map", "markers", "tools", "fog", "lighting", "draw", "layers", "generate", "dice"];
  var LABELS = { map: "Map", markers: "Markers", tools: "Tools", fog: "Fog", lighting: "Lighting", draw: "Draw", layers: "Layers", generate: "Generate", dice: "Dice" };
  var tabs = {}, sets = {};
  ORDER.forEach(function (name) {
    var b = mk("button", "ctl-tab", LABELS[name]);
    b.type = "button"; b.id = name + "Tab";
    b.setAttribute("aria-expanded", "false");
    var caret = mk("span", "ctl-caret", "▾"); b.appendChild(caret);
    bar.appendChild(b); tabs[name] = b;
    var s = mk("div", "ctl-set"); s.id = "set-" + name; s.hidden = true;
    row.appendChild(s); sets[name] = s;
    b.addEventListener("click", function () { openSet(sets[name].hidden ? name : null); });
  });
  /* v1.67: GM view button + its status line take the end of the bar,
     right after Dice (the last tab appended above). */
  if (gmBtn) bar.appendChild(gmBtn);
  if (gmStatus) bar.appendChild(gmStatus);
  function openSet(name) {
    ORDER.forEach(function (n) {
      var on = n === name;
      sets[n].hidden = !on;
      tabs[n].setAttribute("aria-expanded", String(on));
    });
    if (name) sets[name].scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  window.ctlOpen = openSet;
  window.ctlCloseAll = function () { openSet(null); };
  if (gmStatus) { tabs.fog.id = "fogTab"; tabs.lighting.id = "lightTab"; tabs.fog.hidden = !(window.effectiveGm && window.effectiveGm()); tabs.lighting.hidden = tabs.fog.hidden; }

  /* Rows by position: [0] search row, [1] grid row, [2] fogControls,
     [3] lightControls, [4] draw row, [5] layers row, [6] generate row. */
  var rows = panel.querySelectorAll(":scope > .map-tools");
  var rowSearch = rows[0], rowGrid = rows[1], rowDraw = rows[4], rowLayers = rows[5], rowGen = rows[6];

  /* Map — search & switching, grid, screen buttons (moved, not cloned). */
  [fieldOf($("placeSearch")), fieldOf($("mapSelect")), $("mapExpandBtn"), $("fsBtn"), $("view3dBtn"),
   fieldOf($("gridToggle")), fieldOf($("gridType")), fieldOf($("scaleFeet"))].forEach(function (el) {
    if (el) sets.map.appendChild(el);
  });
  /* Markers — Add marker, Add place (GM), the two editing forms. */
  [$("addMarkerBtn"), $("addPlaceBtn"), $("markerForm"), $("placeForm")].forEach(function (el) {
    if (el) sets.markers.appendChild(el);
  });
  /* Tools — Ruler, Ping, Add token, the token editor. */
  [$("rulerBtn"), $("pingBtn"), $("addTokenBtn"), $("tokenStatus"), $("tokenForm")].forEach(function (el) {
    if (el) sets.tools.appendChild(el);
  });
  /* v1.61 (Shaun, voice call 2026-11-07 ~00:03): Push to TV and Ambience
     leave the header and nest inside the Tools set, alongside the tools
     above. Moved, not cloned — ids and handlers are untouched, so Push
     to TV still opens the ?display=1 copy and Ambience still toggles
     sound + backdrop exactly as before.
     v1.71 (Shaun, voice call 2026-11-07 ~13:09: "put the buttons to the
     left"): SUPERSEDED — the header is now a full-width row and its
     buttons go back to the header, all the way LEFT, with the title +
     version tag all the way RIGHT. Still moved, not cloned. */
  var headBtns = document.getElementById("headBtns");
  [$("pushTvBtn"), $("ambBtn")].forEach(function (el) {
    if (el && headBtns) headBtns.appendChild(el);
  });
  /* Fog — the whole GM fog panel. */
  var fogC = $("fogControls"); if (fogC) sets.fog.appendChild(fogC);
  /* Lighting — the whole GM lighting panel plus the light editor form. */
  var lightC = $("lightControls"); if (lightC) sets.lighting.appendChild(lightC);
  if ($("lightForm")) sets.lighting.appendChild($("lightForm"));
  /* Draw — whatever the draw row still holds (colour wheel button incl.). */
  if (rowDraw) moveKids(rowDraw, sets.draw);
  /* Layers — the layers row plus the map overlays toggles from the grid row. */
  if (rowLayers) moveKids(rowLayers, sets.layers);
  [fieldOf($("atlasToggle")), fieldOf($("apocToggle")), fieldOf($("drawToggle")), fieldOf($("tokensToggle"))].forEach(function (el) {
    if (el) sets.layers.appendChild(el);
  });
  /* Generate — Generate map + Templates library. */
  if (rowGen) sets.generate.appendChild(rowGen);
  var tpl = $("tplLib"); if (tpl) sets.generate.appendChild(tpl);
  /* Dice — dice roller + initiative, undressed from the perimeter. */
  var dicePanel = panel.querySelector(":scope > .vtt-panel");
  if (dicePanel) {
    dicePanel.querySelectorAll(".vtt-col").forEach(cleanSlate);
    sets.dice.appendChild(dicePanel);
  }
  /* Remove the emptied husks of the old scattered rows. */
  [rowSearch, rowGrid, rowDraw, rowLayers].forEach(function (r) {
    if (r && !r.children.length && !r.textContent.trim()) r.remove();
  });

  /* When a workflow unhides something living inside a set (an editing form
     opening, the templates library), open that set so it is on screen. */
  var mo = new MutationObserver(function (muts) {
    for (var i = 0; i < muts.length; i++) {
      var t = muts[i].target;
      if (t.nodeType !== 1 || t.hidden) continue;
      for (var n = 0; n < ORDER.length; n++) {
        if (sets[ORDER[n]].contains(t) && sets[ORDER[n]].hidden) { openSet(ORDER[n]); break; }
      }
    }
  });
  ["markerForm", "placeForm", "tokenForm", "lightForm", "tplLib"].forEach(function (id) {
    var el = $(id); if (el) mo.observe(el, { attributes: true, attributeFilter: ["hidden"] });
  });

  /* Stage fullscreen: the row rides into the stage as the right-hand rail
     (Shaun's fullscreen rule: map left, buttons right) and returns on exit. */
  var home = { parent: row.parentNode, next: row.nextSibling };
  document.addEventListener("fullscreenchange", function () {
    var fsEl = document.fullscreenElement;
    if (fsEl && (fsEl === stage || fsEl.contains(stage))) {
      if (row.parentNode !== fsEl) {
        row.style.cssText = "position:absolute;top:0;right:0;bottom:0;width:min(430px,44%);overflow-y:auto;padding:10px;background:rgba(10,12,16,.93);z-index:1200;margin:0;";
        fsEl.appendChild(row);
      }
    } else if (row.parentNode !== home.parent) {
      row.style.cssText = "";
      if (home.next && home.next.parentNode === home.parent) home.parent.insertBefore(row, home.next);
      else home.parent.appendChild(row);
    }
  });
})();
</script>
<script>
/* ================= v1.74: the stage row (Shaun, voice call
   2026-11-07 ~13:46) =================
   "Add just enough room off to the right of the map to add the art
   library dock there vertically." The Art Library's home moves from
   the v1.71 bottom strip back to a RIGHT-SIDE VERTICAL DOCK: stage
   and library are wrapped in a .stage-row flex row — the map column
   (flex 1, flush left) gives up exactly the dock's 300px + the 14px
   gutter, the bubble still spans full width. This runs before the
   perimeter script: with no saved float, the perimeter returns the
   library to flow, which is now the dock; a saved float still wins
   (the library floats free and stays where Shaun left it), and the
   grip's double-click home is the dock. Fullscreen / Expand unwrap
   the row via display:contents (see the v1.74 CSS). */
(function(){
  var panel = document.getElementById("mapPanel");
  if (!panel) return;
  var stage = panel.querySelector(":scope > .map-stage");
  var repo = panel.querySelector(":scope > .map-repo");
  if (!stage || !repo) return;
  var wrap = document.createElement("div");
  wrap.className = "stage-row";
  stage.parentNode.insertBefore(wrap, stage);
  wrap.appendChild(stage);
  wrap.appendChild(repo);
})();
</script>

<script>
"use strict";
/* ================= v1.06: perimeter-always, movable groups =================
   Desktop/table only (phones keep the right-edge repository drawer).
   Default arrangement is the page flow itself: toolbars across the
   top, the repository docked at the right of the map, dice and
   initiative along the bottom — and Full screen / Expand / Project
   now carry that same perimeter (see the CSS), so nothing hides,
   collapses or relocates when the view is maximized.
   Shaun can drag any group by its grip ("⠿" handle) to any edge of
   the table panel: top/bottom park it as a horizontal row, left/
   right as a vertical stack. Groups stay whole and transparent.
   The arrangement persists per device in localStorage under
   "apocVttPerimeterV2" as {groupId:{edge,along}}; "Reset layout"
   in the header clears it and restores the defaults. */
(function(){
  /* Layout epoch V2 (v1.56): the v1.55 restore changed the base layout
     (map on top, groups below), so parks saved under the old v1.49/v1.50
     arrangement — groups parked around the TOP of the panel, back when
     the controls lived above the map — must not resurrect it: on Shaun's
     device they pulled the tool groups back up over the top of the map
     ("buttons mixed up with the top of the map"). Parks now live under a
     new key; the V1 key is discarded once, below, and every device starts
     from the clean v1.55 flow. Dragging saves/restores under V2 exactly
     as it did under V1 (the v1.51 restore logic is unchanged). */
  var KEY = "apocVttPerimeterV2";
  try { window.localStorage.removeItem("apocVttPerimeterV1"); } catch(e) {}
  var mq = window.matchMedia("(min-width: 821px)");
  var panel = document.getElementById("mapPanel");
  if (!panel) return;
  var rows = panel.querySelectorAll(":scope > .map-tools");
  var cols = panel.querySelectorAll(":scope > .vtt-panel > .vtt-col");
  var repo = panel.querySelector(".map-repo"); /* v1.74: the library lives inside .stage-row now (right-side dock) — a descendant query, not :scope; with :scope the perimeter stewarded nothing and saved floats were ignored */
  var defs = [];
  function def(el, id, label){ if (el) defs.push({ el: el, id: id, label: label }); }
  def(rows[0], "tools-main", "Search & map");
  def(rows[1], "tools-grid", "Grid, tokens & GM");
  /* v1.60: fogControls / lightControls are NOT perimeter groups any
     more — they live inside the Fog / Lighting sets of the one row under
     the map (see the row script above), which must stay in page flow.
     The perimeter now stewards only the Art Library dock (repo, below);
     the old row/col defs above and below match nothing since the
     restructure and are kept inert for the reset button's sake. */
  def(rows[4], "tools-draw", "Draw & paint");
  def(rows[5], "tools-layers", "Layers");
  def(rows[6], "tools-gen", "Generate map");
  def(repo, "repo", "Art Library");
  def(cols[0], "dice", "Dice");
  def(cols[1], "init", "Initiative");
  var byId = {};
  defs.forEach(function(d){
    d.el.dataset.perGroup = d.id;
    d.el.classList.add("per-group");
    byId[d.id] = d;
    var grip = document.createElement("span");
    grip.className = "per-grip";
    grip.textContent = "⠿ " + d.label;
    grip.title = "Drag to move the " + d.label + " group to any edge";
    d.el.insertBefore(grip, d.el.firstChild);
    d.grip = grip;
  });
  /* v1.71: the Art Library grip says what it now does, and a
     double-click on it sends the library home to the bottom strip. */
  if (byId.repo) {
    byId.repo.grip.title = "Drag to float the Art Library — it stays where you leave it. Double-click to send it back to the right-side dock.";
    byId.repo.grip.addEventListener("dblclick", function(){
      var state = load();
      delete state.repo;
      save(state);
      applyPark(byId.repo, null);
      setTimeout(function(){ window.dispatchEvent(new Event("resize")); }, 60);
    });
  }

  /* Repository open by default on desktop — part of the perimeter. */
  function repoDefault(){
    if (!mq.matches) return;
    var lib = document.getElementById("tokenLib");
    var btn = document.getElementById("libBtn");
    if (lib && lib.hidden) { lib.hidden = false; if (btn) btn.setAttribute("aria-pressed", "true"); }
  }
  repoDefault();

  function load(){
    try { return JSON.parse(window.localStorage.getItem(KEY) || "{}") || {}; }
    catch(e) { return {}; }
  }
  function save(state){
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  }
  /* v1.71 (Shaun, voice call 2026-11-07 ~13:19-13:22): the Art Library
     NO LONGER DOCKS. Diagnosis of "the library docked itself": the
     v1.06 perimeter scheme below only ever knew EDGE parks — a drop
     saved {edge, along} for the nearest panel edge, and applyAll()
     re-applied that dock on load, on window resize and on
     fullscreenchange — so wherever Shaun left the library, it
     snapped to an edge and kept re-snapping there. (The blown-up-park
     self-heal from the panel build never shipped; it is not in this
     code.) The library now FREE-FLOATS: a drop saves its exact
     panel-relative {float:{x,y,w}}, applyAll re-applies exactly
     that, and nothing else moves it. Legacy {edge,along} records for
     the repo — the old docks, including any on Shaun's device — are
     NOT re-applied: the library falls back to its default home, the
     horizontal strip across the bottom of the bubble (amendment,
     ~13:22). A genuinely blown float (saved far outside the panel)
     is healed by CLAMPING it back inside at a floating spot — never
     by force-docking. Double-click the grip returns it to the strip. */
  function applyRepoPark(el, park){
    if (el.classList.contains("per-dragging")) return; /* a re-apply must never strip a live drag's inline position */
    /* Measure the panel FIRST, with the current layout untouched:
       clearing the float before measuring drops the library back
       into the flow, inflating the panel by the strip's own height
       (~110px) — the heal then clamped against that phantom taller
       panel and left the library hanging below the real bottom. */
    var pr = panel.getBoundingClientRect();

<script>
/* ================= v1.71: the zoom bar (Shaun, voice call

   "I still don't see the bar scroller, the bar zoomer. I told you
   where to put it" — its home is the gutter between the map window

   is parked. The bar also carries the Pinch checkbox (v1.73):
   gesture zoom is OFF unless Shaun ticks it — the v1.73 block
   below owns the Leaflet handler state and this bar's sync()

   zoom is per-device Leaflet state, nothing shared is written. */
(function(){
  var bar = document.getElementById("zoomBar");

  var grip = document.getElementById("zoomBarGrip");
  var el = document.getElementById("apocMap");

  if (!bar || !slider || !grip || !el || !side) return;
  var KEY = "apocVttZoomBarV1";
  var mq = window.matchMedia("(min-width: 821px)");

    try {

      if (p && typeof p.l === "number" && typeof p.t === "number") return p;
    } catch(e) {}

  }
  function savePos(p){
    try { if (p) localStorage.setItem(KEY, JSON.stringify(p)); } catch(e) {}
  }

    return !mq.matches || !!document.fullscreenElement ||
      document.body.classList.contains("displaying") ||

  }

       STRADDLES the map column's right edge, and a parked bar may
       sit over the library's left edge; clamping to the map column
       alone would pin it inside the window, off the gutter. */

    var maxT = Math.max(0, side.clientHeight + 44 - bar.offsetHeight); /* the bar may ride into the gutter band under the window (its home straddles the bottom edge) */

      var maxT = Math.max(0, side.clientHeight + 44 - bar.offsetHeight);

    grip.addEventListener("pointerup", up);

    var m = window.map;

      m.on("zoomend", function(){ slider.value = m.getZoom(); });

      setTimeout(sync, 350);
    } else setTimeout(waitMap, 120);
  })();
})();

<script>
/* ================= v1.73: the Pinch checkbox (Shaun, voice call
   2026-11-07 ~13:39, correcting v1.72's hard removal seconds

   checkbox INSIDE the bar itself, so it travels with the bar
   when Shaun drags it to a new park. One switch for the gesture
   zooms: Leaflet touchZoom (two-finger pinch and double-tap),
   doubleClickZoom and scrollWheelZoom — and the browser-level
   pinch blocks below follow the same switch (active only while
   OFF). DEFAULT OFF (unchecked): zoom through the slider only,
   Shaun's standing line; the checkbox is his option to turn
   gesture zoom back on when he wants it. The choice persists
   per device in localStorage apocVttPinchZoomV1 ("1" = on) and
   toggling applies LIVE via handler enable()/disable(), no
   reload. Box zoom and keyboard zoom are NOT on the switch —
   they stay off, as v1.72 left them. One-finger drag pan always
   works, and the slider always zooms, checkbox or not. The map
   creation options still start every handler off; this block
   applies the saved choice as soon as the map exists, and the
   zoom bar's sync() re-applies it through window.__apocPinchApply
   so nothing else can fight the switch. Pure view control:
   nothing shared is written. */
(function(){
  var el = document.getElementById("apocMap");
  var chk = document.getElementById("zoomPinchChk");
  if (!el) return;
  var KEY = "apocVttPinchZoomV1";
  function isOn(){
    if (chk) return !!chk.checked;
    try { return localStorage.getItem(KEY) === "1"; } catch(e) { return false; }
  }
  function apply(){
    var m = window.map;
    if (!m) return;
    var on = isOn();
    [["touchZoom", on], ["scrollWheelZoom", on], ["doubleClickZoom", on], ["boxZoom", false], ["keyboard", false]].forEach(function(pair){
      var h = m[pair[0]];
      if (!h || !h.enable || !h.disable || !h.enabled) return;
      if (pair[1] && !h.enabled()) h.enable();
      if (!pair[1] && h.enabled()) h.disable();
    });
  }
  window.__apocPinchApply = apply;
  if (chk) {
    try { chk.checked = localStorage.getItem(KEY) === "1"; } catch(e) { chk.checked = false; }
    chk.addEventListener("change", function(){
      try { localStorage.setItem(KEY, chk.checked ? "1" : "0"); } catch(e) {}

    });
  }
  (function waitMap(){
    if (window.map && window.map.on){

      setTimeout(apply, 1500);

  })();
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){
    el.addEventListener(t, function(e){ if (!isOn()) e.preventDefault(); }, { passive: false });
  });
  el.addEventListener("wheel", function(e){ if (e.ctrlKey && !isOn()) e.preventDefault(); }, { passive: false });
})();
</script>

<script>

(function(){

      var nm = o.type === "text" ? "Text" : (o.type === "stamp" ? "Stamp" : "Drawing");
      return { title: nm, items: [
        { label: "Bring to front", fn: function(){ window.vttDraw.reorder(o, 1); } },
        { label: "Send to back", fn: function(){ window.vttDraw.reorder(o, -1); } },
        { label: "Delete " + nm.toLowerCase(), danger: true, fn: function(){ if (confirm("Delete this " + nm.toLowerCase() + " for everybody?")) window.vttDraw.del(o); } }

            for (var si = 0; si + 1 < cps.length; si++) dmin = Math.min(dmin, segDist(cp.x, cp.y, cps[si].x, cps[si].y, cps[si + 1].x, cps[si + 1].y));

            if (d.a && d.b) return Math.abs(d.a[0] - p2.x) < 0.4 && Math.abs(d.a[1] - p2.y) < 0.4;
            return false;
          });

        }
      }
    }
    if (!hit && gm() && window.vttLights) {

(function(){

<script>
/* v1.76: Push to TV + Ambience live in a cluster beside GM view, in
   .map-tools, in the order GM view | Push to TV | Ambience. The older
   header-move script relocates Push/Ambience into #headBtns; this
   script re-asserts the cluster until it is stable. Moves only —
   listeners and behaviour are untouched. */
(function(){
  "use strict";
  var started = Date.now(), stableSince = 0, stopped = false, busy = false;
  function assertCluster(){
    var gm = document.getElementById("gmBtn");
    var push = document.getElementById("pushTvBtn");
    var amb = document.getElementById("ambBtn");
    if (!gm || !push || !amb || !gm.parentNode) return false;
    var parent = gm.parentNode;
    if (gm.nextSibling !== push) parent.insertBefore(push, gm.nextSibling);
    if (push.nextSibling !== amb) parent.insertBefore(amb, push.nextSibling);
    var hb = document.getElementById("headBtns");
    return gm.nextSibling === push && push.nextSibling === amb && (!hb || hb.childElementCount === 0);
  }
  function tick(){
    if (stopped) return true;
    var ok = false;
    try { ok = assertCluster(); } catch (e) {}
    if (ok) { if (!stableSince) stableSince = Date.now(); }
    else stableSince = 0;
    if ((stableSince && Date.now() - stableSince >= 2000) || Date.now() - started >= 10000) { stop(); return true; }
    return false;
  }
  var timer = setInterval(tick, 250);
  var mo = null;
  function stop(){
    stopped = true;
    clearInterval(timer);
    if (mo) { try { mo.disconnect(); } catch (e) {} mo = null; }
  }
  function watch(){
    var hb = document.getElementById("headBtns");
    var gm = document.getElementById("gmBtn");
    if (!hb && !(gm && gm.parentNode)) return;
    mo = new MutationObserver(function(){
      if (busy || stopped) return;
      busy = true;
      try { tick(); } catch (e) {}
      busy = false;
    });
    if (hb) mo.observe(hb, { childList: true });
    if (gm && gm.parentNode) mo.observe(gm.parentNode, { childList: true });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ tick(); watch(); });
  else { tick(); watch(); }
  tick();
})();
</script>

<script>
/* APOC-V177: Screen 2 — a second player display at ?display=2.
   Screen 1 (?display=1, the Push to TV copy) is unchanged and follows
   the shared vtt_active key. Screen 2 follows its OWN key
   vtt_active_2 in the same site_settings store; until a map is sent
   to it, it MIRRORS Screen 1.

   the map. On a ?display=2 page this block (a) remembers the last
   known vtt_active_2 assignment (sessionStorage, read synchronously
   at parse time — before the engine initialises), (b) rewrites the
   engine's vtt_active settings READ to vtt_active_2 at the fetch
   layer while an assignment exists, so the engine itself drives
   Screen 2, and (c) polls vtt_active_2 every 4s (read-only) and
   reloads the display once whenever the assignment changes, so a
   Send / Mirror lands within seconds instead of at the next
   60-second engine poll. The display never writes shared state:
   its only requests are reads.

   Push to TV (they sit right after the GM/Push/Ambience cluster). */

    try { stored = sessionStorage.getItem(SS); haveStored = stored !== null; } catch (e) {}

              var nu = url.replace("key=eq.vtt_active", "key=eq.vtt_active_2");
              input = typeof input === "string" ? nu : new Request(nu, input);
            }
          }
        } catch (e) {}
        return origFetch(input, init);

    }

    async function poll(){
      try {
        if (typeof db === "undefined" || typeof SETTINGS_TABLE === "undefined") return;
        var res = await db.from(SETTINGS_TABLE).select("value").eq("key", KEY2).maybeSingle();
        var id = res && res.data && res.data.value && res.data.value.mapId ? String(res.data.value.mapId) : null;

    var sel = document.getElementById("mapSelect");

    var send = document.getElementById("screen2SendBtn");

    if (anchor.nextSibling !== send) anchor.parentNode.insertBefore(send, anchor.nextSibling);
    if (send.nextSibling !== mir) send.parentNode.insertBefore(mir, send.nextSibling);
  }

    var push = document.getElementById("pushTvBtn");
    if (!push || !push.parentNode || document.getElementById("screen2SendBtn")) return;
    var send = document.createElement("button");
    send.type = "button"; send.className = "btn"; send.id = "screen2SendBtn";
    send.textContent = "Screen 2: Send current map";
    var mir = document.createElement("button");
    mir.type = "button"; mir.className = "btn"; mir.id = "screen2MirrorBtn";
    mir.textContent = "Screen 2: Mirror";

          { key: KEY2, value: { mapId: id }, updated_at: new Date().toISOString() },

   closed page overflow by +88px at 1920x1080 and +454px at 1366x768.

   closed state only, if the page has less than 8px of slack it trims
   the map window's height by the shortfall (floor 240px) and clamps

    document.querySelectorAll(".per-group, .map-repo").forEach(function(el){
      if (el.dataset.fpDone) return; el.dataset.fpDone = "1";
      var id = el.classList.contains("map-repo") ? "per-repo" : ("per-" + (el.dataset.perGroup || el.id || "grp"));
      var grip = el.querySelector(".per-grip");
      addLock(el, id, grip && grip.parentElement === el ? grip : el);
      addHandles(el, id);
      var rp = rec[id];
      if (rp && (rp.w || rp.h)) { if (rp.w) el.style.width = rp.w + "px"; if (rp.h) el.style.height = rp.h + "px"; }
      paintLock(el, id);
    });
    var zb = document.getElementById("zoomBar"); if (zb && !zb.dataset.fpDone) { zb.dataset.fpDone = "1"; addLock(zb, "zoombar", zb); paintLock(zb, "zoombar"); }
  }

  var tries = 0;
  function boot(){ register(); fitLib(); if (++tries < 4) setTimeout(boot, 1600); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ setTimeout(boot, 2200); });
  else setTimeout(boot, 2200);
  document.addEventListener("click", function(){ setTimeout(fitLib, 350); setTimeout(fitLib, 1000); }, true);
  window.addEventListener("resize", function(){ setTimeout(fitLib, 300); });
  setInterval(function(){ var lib = document.getElementById("artLibrary"); if (lib && lib.classList.contains("open")) fitLib(); }, 1800);
})();
