    if (lastPlaceGm !== null && g !== lastPlaceGm && currentMapId !== "faerun") drawPlaces();
    lastPlaceGm = g;
    if (currentMapId === "faerun") searchInput.placeholder = "Search \u2014 e.g. Silverymoon, Candlekeep, Waterdeep";
    else searchInput.placeholder = places.length ? "Find a place on this map" : "No places on this map yet";
  }
  setInterval(refreshPlaceUI, 1000);
  function closePlaceEditor(){ placeForm.hidden = true; editingPlace = null; if (tempPlacePin) { placesLayer.removeLayer(tempPlacePin); tempPlacePin = null; } }
  function openPlaceEditor(state){
    closePlaceEditor();
    editingPlace = state;
    const isEdit = state.mode === "edit";
    $("placeDelete").hidden = !isEdit;
    $("placeName").value = isEdit ? (state.p.n || "") : "";
    $("placeNote").value = isEdit ? (state.p.d || "") : "";
    if (!isEdit) tempPlacePin = L.marker(toLatLng(state.x, state.y), { icon: iconFor("place", "New place", true) }).addTo(placesLayer);
    placeForm.hidden = false;
  }
  $("addPlaceBtn").addEventListener("click", () => {
    placeArm = !placeArm;
    if (placeArm && typeof markerArm !== "undefined" && markerArm) { markerArm = false; $("addMarkerBtn").setAttribute("aria-pressed", "false"); }
    $("addPlaceBtn").setAttribute("aria-pressed", String(placeArm));
    if (placeArm) setStatus("Tap the map where the place goes.");
  });
  map.on("click", e => {
    if (!placeArm || isProjecting() || !effectiveGm()) return;
    if (typeof armedMode !== "undefined" && armedMode) return;
    if (typeof rulerOn !== "undefined" && rulerOn) return;
    placeArm = false;
    $("addPlaceBtn").setAttribute("aria-pressed", "false");
    const p = toXY(e.latlng);
    openPlaceEditor({ mode: "new", x: p.x, y: p.y });
  });
  $("placeCancel").addEventListener("click", closePlaceEditor);
  $("placeDelete").addEventListener("click", async () => {
    if (!editingPlace || editingPlace.mode !== "edit") return;
    const p = editingPlace.p;
    if (!confirm(`Delete the place "${p.n}" from this map? Everybody will stop seeing it.`)) return;
    places = places.filter(x => x.id !== p.id);
    const ok = await savePlaces();
    if (!ok) { setStatus("That delete didn't go through — try again."); loadPlaces(true); return; }
    closePlaceEditor(); drawPlaces(); refreshPlaceUI(); setStatus(`"${p.n}" deleted for everybody.`);
  });
  placeForm.addEventListener("submit", async ev => {
    ev.preventDefault();
    if (!editingPlace) return;
    const name = $("placeName").value.trim();
    if (!name) { $("placeName").focus(); return; }
    const note = $("placeNote").value.trim();
    if (editingPlace.mode === "new") {
      places.push({ id: newId(), n: name, x: editingPlace.x, y: editingPlace.y, d: note });
      const ok = await savePlaces();
      if (!ok) { places.pop(); setStatus("That place didn't save — check the connection and try again."); return; }
    } else {
      Object.assign(editingPlace.p, { n: name, d: note });
      const ok = await savePlaces();
      if (!ok) { setStatus("That change didn't save — try again."); loadPlaces(true); return; }
    }
    closePlaceEditor(); drawPlaces(); refreshPlaceUI(); setStatus(`"${name}" saved — the whole table sees it.`);
  });
  loadPlaces(true);

  /* v1.71: hooks for the right-click options menu. Places on the
     Faerûn atlas are canon data, not user-placed — the menu only
     offers Edit/Delete on per-map places (isAtlas() false). */
  window.vttPlaces = {
    openEditor: openPlaceEditor, list: currentPlaces, isAtlas: () => currentMapId === "faerun",
    del: async p => { places = places.filter(x => x.id !== p.id); const ok = await savePlaces(); drawPlaces(); refreshPlaceUI(); return ok; }
  };

  /* ---- Push to TV (v1.07, Shaun): opens a SECOND copy of this page in
        ?display mode for the TV — map only, player view, editing locked.
        This laptop copy stays exactly as it is, with all the controls.
        Both copies read the same shared store (active map, tokens, fog,
        drawings, pings), so everything changed here shows there live. ---- */
  $("pushTvBtn").addEventListener("click", () => {
    const u = new URL(location.href);
    u.searchParams.set("display", "1");
    u.searchParams.delete("v");
    u.hash = "";
    window.open(u.href, "_blank", "noopener");
    setStatus("TV copy opened in a new tab — put that tab on the TV. This copy keeps the controls; everything you change here shows there live.");
  });

  /* Expand map: the button stays in the tools row, but it opens the MAP
     WINDOW itself (#apocMap) full screen — Shaun's correction, 2026-11-05.
     Fullscreen on the map element where supported; a full-viewport fixed
     overlay is the fallback. Dragging markers/tokens, drawing, fog and the
     ruler all work on the map in this view; the perimeter of controls
     (and the editing forms) stays around the edges. Exit: the on-map
     Exit button or Esc. */
  function setExpanded(on){
    document.body.classList.toggle("map-expanded", on);
    $("mapExpandBtn").textContent = on ? "⛶ Exit full screen" : "⛶ Expand map";
    setTimeout(() => map.invalidateSize(), 280);
  }
  $("mapExpandBtn").addEventListener("click", () => {
    /* Shaun (2026-11-06, final shape): Expand map enlarges the MAP AREA —
       the stage (map + its docked library) fills the screen — and while
       it's enlarged, ALL the utensils stack in one rail on the right of
       the stage, the map off to the left (fsToolsIn below; his ~20:01
       ruling undoing the floating groups). The old whole-panel overlay
       (setExpanded) remains only as the fallback when element
       fullscreen is unavailable or refused. */
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (document.body.classList.contains("map-expanded")) { setExpanded(false); return; }
    const el = document.querySelector(".map-stage");
    let started = false;
    try {
      if (el.requestFullscreen) { const r = el.requestFullscreen(); started = true; if (r && r.catch) r.catch(() => setExpanded(true)); }
      else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); started = true; }
    } catch(e) { /* fall through to the overlay fallback */ }
    if (!started) setExpanded(true);
  });
  const expandExitCtl = L.control({ position: "topright" });
  expandExitCtl.onAdd = () => {
    const d = L.DomUtil.create("div", "expand-exit-wrap");
    d.innerHTML = '<button type="button" class="btn primary">Exit full screen</button>';
    L.DomEvent.on(d.querySelector("button"), "click", () => {
      setExpanded(false);
      if (document.fullscreenElement) document.exitFullscreen();
    });
    return d;
  };
  expandExitCtl.addTo(map);
  /* When the map is enlarged (the stage is the fullscreen element),
     the utensil groups leave their places below the map and stack in
     ONE rail on the right of the stage \u2014 map off to the left, all
     buttons on the right, in page order, fully visible, nothing
     floating over the play area (Shaun, 2026-11-06 ~20:01: "undo this
     mess\u2026 so they're visible\u2026 not all cluttered"). This supersedes
     the v1.31\u2013v1.33 free-floating groups and tear-out pieces; the old
     per-device float positions (apocVttFsFloatV1) are dropped. On
     exit every group goes back to its exact home below the map. */
  let fsFloatHomes = null;
  let fsRailEl = null;
  try { window.localStorage.removeItem("apocVttFsFloatV1"); } catch(e) {}
  function fsToolsIn(){
    const stage = document.querySelector(".map-stage");
    const panel = document.getElementById("mapPanel");
    if (!stage || !panel || fsFloatHomes) return;
    const items = [];
    panel.querySelectorAll(":scope > .map-tools").forEach((r) => { if (!stage.contains(r)) items.push({ el: r }); });
    panel.querySelectorAll(":scope > .vtt-panel > .vtt-col").forEach((c) => { items.push({ el: c }); });
    if (!items.length) return;
    fsFloatHomes = items.map(it => ({ el: it.el, parent: it.el.parentNode, next: it.el.nextSibling }));
    fsRailEl = document.createElement("div");
    fsRailEl.className = "fs-rail";
    fsRailEl.setAttribute("aria-label", "Map controls");
    stage.appendChild(fsRailEl);
    items.forEach(it => { fsRailEl.appendChild(it.el); });
  }
  function fsToolsOut(){
    if (!fsFloatHomes) return;
    for (let i = fsFloatHomes.length - 1; i >= 0; i--) {
      const h = fsFloatHomes[i];
      if (h.next && h.next.parentNode === h.parent) h.parent.insertBefore(h.el, h.next);
      else h.parent.appendChild(h.el);
    }
    fsFloatHomes = null;
    if (fsRailEl) { fsRailEl.remove(); fsRailEl = null; }
  }

  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && document.body.classList.contains("map-expanded")) setExpanded(false);
    const stageFs = !!document.fullscreenElement && document.fullscreenElement.classList.contains("map-stage");
    document.body.classList.toggle("map-fs", stageFs);
    if (stageFs) fsToolsIn(); else fsToolsOut();
    if (!document.body.classList.contains("map-expanded")) $("mapExpandBtn").textContent = stageFs ? "⛶ Exit full screen" : "⛶ Expand map";
    setTimeout(() => map.invalidateSize(), 200);
  });

  /* ================= VTT Phase 1: grid, shared scale, tokens, ruler =================
     Tokens and the table scale live in the shared site_settings store
     (keys "vtt_tokens" / "vtt_settings") — everybody sees the same tabletop.
     Grid geometry: CELL map units per square on this map; the shared scale
     setting says how many feet one square stands for (default 5). */
  let CELL = 60;
  const tokensKey = () => currentMapId === "faerun" ? "vtt_tokens" : `vtt_tokens_${currentMapId}`;
  const vttKey = () => currentMapId === "faerun" ? "vtt_settings" : `vtt_settings_${currentMapId}`;
  const STATUSES = [
    { k:"bloodied", label:"Bloodied", c:"#d9534f" },
    { k:"poisoned", label:"Poisoned", c:"#58b368" },
    { k:"stunned", label:"Stunned", c:"#e8c33d" },
    { k:"blessed", label:"Blessed", c:"#7aa2c4" },
    { k:"cursed", label:"Cursed", c:"#9a86c8" },
    { k:"dead", label:"Dead", c:"#22242c" }
  ];
  let tokens = [], feetPerSquare = 5, gridOn = false, gmView = false, gridType = "square", scaleUnit = "ft";
  const tokenLayer = L.layerGroup().addTo(map);
  const tokenMarkers = {}; /* token id -> marker, for the v1.09 lighting visibility pass */
  const gridLayer = L.layerGroup();
  const tokenStatusEl = $("tokenStatus");
  /* Sibling scripts (monster repository) place tokens through these —
     expose them on window; "tokens" is a reassigned let, so it needs a
     live accessor rather than a snapshot. */
  window.tokenStatusEl = tokenStatusEl;
  window.loadTokens = loadTokens; window.saveTokens = saveTokens; window.drawTokens = drawTokens;
  Object.defineProperty(window, "tokens", { configurable: true, get(){ return tokens; }, set(v){ tokens = v; } });
  const tokenForm = $("tokenForm");
  let editingToken = null, draftStatus = [];

  function hexR(){ return CELL * 0.575; }
  function hexCenters(){
    const R = hexR(), dx = 1.5 * R, dy = Math.sqrt(3) * R, out = [];
    let col = 0;
    for (let cx = R; cx < MW + dx; cx += dx, col++) {
      const off = (col % 2) ? dy / 2 : 0;
      for (let cy = R + off; cy < MH + dy; cy += dy) out.push([cx, cy]);
    }
    return out;
  }
  function hexCorners(cx, cy){
    const R = hexR(), pts = [];
    for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k; pts.push([cy + R * Math.sin(a), cx + R * Math.cos(a)]); }
    return pts;
  }
  function drawGrid(){
    gridLayer.clearLayers();
    if (!gridOn) return;
    const opts = { pane:"layerMap", color:"#e9e2cf", weight:1, opacity:0.16, interactive:false };
    if (gridType === "hex") {
      const b = map.getBounds().pad(0.2);
      for (const c of hexCenters()) {
        const fc = llRot(c[1], c[0]); /* cull in the (possibly rotated) view frame */
        if (fc[1] < b.getWest() - CELL || fc[1] > b.getEast() + CELL || fc[0] < b.getSouth() - CELL || fc[0] > b.getNorth() + CELL) continue;
        gridLayer.addLayer(L.polygon(hexCorners(c[0], c[1]).map(([la, ln]) => llRot(la, ln)), { ...opts, fill: false }));
      }
      return;
    }
    for (let gx = 0; gx <= MW; gx += CELL) gridLayer.addLayer(L.polyline([llRot(0, gx), llRot(MH, gx)], opts));
    for (let gy = 0; gy <= MH; gy += CELL) gridLayer.addLayer(L.polyline([llRot(gy, 0), llRot(gy, MW)], opts));
  }
  $("gridToggle").addEventListener("change", ev => {
    gridOn = ev.target.checked;
    drawGrid();
    if (gridOn) gridLayer.addTo(map); else map.removeLayer(gridLayer);
  });
  map.on("moveend zoomend", () => { if (gridOn && gridType === "hex") drawGrid(); });
  $("gridType").addEventListener("change", async () => {
    gridType = $("gridType").value;
    drawGrid();
    const ok = await saveVttSettings();
    tokenStatusEl.textContent = ok ? `Grid for this map: ${gridType === "hex" ? "hexes" : "squares"}.` : "Grid didn't save — try again.";
  });

  function scaleInputVal(){ return scaleUnit === "mi" ? Math.round(feetPerSquare / 5280 * 100) / 100 : feetPerSquare; }
  async function loadVttSettings(quiet){
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", vttKey()).maybeSingle();
    if (error) return;
    if (data && data.value) {
      if (Number(data.value.feetPerSquare) > 0) feetPerSquare = Number(data.value.feetPerSquare);
      if (data.value.unit === "mi" || data.value.unit === "ft") scaleUnit = data.value.unit;
      if (data.value.gridType === "hex" || data.value.gridType === "square") gridType = data.value.gridType;
      const rotIn = Number(data.value.rotation);
      if ([0, 1, 2, 3].includes(rotIn) && rotIn !== mapRot) { mapRot = rotIn; applyMapRotation(); }
      if (document.activeElement !== $("scaleFeet")) $("scaleFeet").value = scaleInputVal();
      $("scaleUnit").value = scaleUnit;
      $("gridType").value = gridType;
      if (gridOn) drawGrid();
    }
  }
  async function saveVttSettings(){
    const { error } = await db.from(SETTINGS_TABLE).upsert(
      { key: vttKey(), value: { feetPerSquare, unit: scaleUnit, gridType, rotation: mapRot }, updated_at: new Date().toISOString() },
      { onConflict: "key" }
    );
    return !error;
  }
  $("scaleFeet").addEventListener("change", async () => {
    const v = parseFloat($("scaleFeet").value);
    if (!(v > 0)) return;
    feetPerSquare = scaleUnit === "mi" ? v * 5280 : v;
    const ok = await saveVttSettings();
    tokenStatusEl.textContent = ok ? `Scale set: ${v} ${scaleUnit === "mi" ? "miles" : "feet"} per ${gridType === "hex" ? "hex" : "square"}.` : "Scale didn't save — try again.";
  });
  $("scaleUnit").addEventListener("change", async () => {
    scaleUnit = $("scaleUnit").value;
    $("scaleFeet").value = scaleInputVal();
    const ok = await saveVttSettings();
    tokenStatusEl.textContent = ok ? `Scale unit: ${scaleUnit === "mi" ? "miles" : "feet"} per ${gridType === "hex" ? "hex" : "square"} (same scale, shown in ${scaleUnit === "mi" ? "miles" : "feet"}).` : "Scale unit didn't save — try again.";
  });

  async function loadTokens(quiet){
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", tokensKey()).maybeSingle();
    if (error) { if (!quiet) tokenStatusEl.textContent = "Tokens could not be loaded — try again in a few seconds."; return; }
    tokens = (data && data.value && Array.isArray(data.value.tokens)) ? data.value.tokens : [];
    drawTokens();
    tokenStatusEl.textContent = tokens.length ? `${tokens.length} token${tokens.length === 1 ? "" : "s"} on the table.` : "No tokens yet — Add token drops one at the center of the view.";
  }
  async function saveTokens(){
    const { error } = await db.from(SETTINGS_TABLE).upsert(
      { key: tokensKey(), value: { tokens }, updated_at: new Date().toISOString() },
      { onConflict: "key" }
    );
    return !error;
  }

  function tokenPx(size){
    const raw = CELL * Math.pow(2, map.getZoom()) * (size || 1);
    return Math.max(26, Math.min(220, Math.round(raw)));
  }
  function tokenIcon(tk){
    const px = tokenPx(tk.size);
    const initial = esc((tk.name || "?").trim().charAt(0).toUpperCase() || "?");
    const disc = tk.img ? `<img src="${esc(tk.img)}" alt="">` : (tk.sym ? esc(tk.sym) : initial);
    let hp = "";
    if (tk.maxHp > 0) {
      const pct = Math.max(0, Math.min(100, Math.round(((tk.hp || 0) / tk.maxHp) * 100)));
      const col = pct > 50 ? "#58b368" : pct > 25 ? "#e8c33d" : "#d9534f";
      hp = `<div class="tk-hp" style="width:${px}px"><span style="width:${pct}%;background:${col}"></span></div>`;
    }
    const dots = (tk.status || []).map(k => {
      const st = STATUSES.find(x => x.k === k);
      return st ? `<i style="background:${st.c}"></i>` : "";
    }).join("");
    return L.divIcon({
      className: "tk-icon",
      html: `<div class="tk tkc-${tk.color || "amber"}${tk.gm ? " tk-gm" : ""}" style="width:${px}px"><div class="tk-disc" style="width:${px}px;height:${px}px;font-size:${Math.round(px * 0.45)}px${tk.flip ? ";transform:scaleX(-1)" : ""}">${disc}</div>${hp}<div class="tk-status">${dots}</div><span class="tk-label">${esc(tk.name || "Token")}</span></div>`,
      iconAnchor: [px / 2, px / 2]
    });
  }
  function drawTokens(){
    tokenLayer.clearLayers();
    for (const k in tokenMarkers) delete tokenMarkers[k];
    for (const tk of tokens) {
      if (tk.gm && !effectiveGm()) continue;
      if (tk.light > 0 && !window.__apocLightOn) tokenLayer.addLayer(L.circle(toLatLng(tk.x, tk.y), { pane: "layerTokens", radius: tk.light / feetPerSquare * CELL, color: "#e8a33d", weight: 1, dashArray: "4 4", fillColor: "#e8a33d", fillOpacity: 0.08, interactive: false }));
      const m = L.marker(toLatLng(tk.x, tk.y), { pane: "layerTokens", draggable: !tk.lock, icon: tokenIcon(tk) }).addTo(tokenLayer);
      tokenMarkers[tk.id] = m;
      m.on("click", () => {
        if (isProjecting() || document.body.classList.contains("map-expanded")) {
          L.popup().setLatLng(m.getLatLng()).setContent(`<b>${esc(tk.name)}</b>${tk.maxHp > 0 ? `<br>HP ${tk.hp || 0}/${tk.maxHp}` : ""}`).openOn(map);
          return;
        }
        openTokenEditor({ mode: "edit", tk });
      });
      m.on("dragend", async () => {
        let p = toXY(m.getLatLng());
        if (gridOn && gridType === "hex") {
          const lng = p.x / 100 * MW, lat = MH * (1 - p.y / 100);
          let best = null, bd = Infinity;
          for (const c of hexCenters()) { const d = (c[0] - lng) * (c[0] - lng) + (c[1] - lat) * (c[1] - lat); if (d < bd) { bd = d; best = c; } }
          if (best) p = { x: Math.round(best[0] / MW * 10000) / 100, y: Math.round((1 - best[1] / MH) * 10000) / 100 };
        } else if (gridOn) {
          p = {
            x: Math.round(((Math.floor((p.x / 100 * MW) / CELL) + 0.5) * CELL / MW * 100) * 100) / 100,
            y: Math.round(((Math.floor((p.y / 100 * MH) / CELL) + 0.5) * CELL / MH * 100) * 100) / 100
          };
        }
        tk.x = p.x; tk.y = p.y;
        const ok = await saveTokens();
        tokenStatusEl.textContent = ok ? `${tk.name} moved — saved for everybody.` : "That move didn't save — try again.";
        if (!ok) loadTokens(true); else drawTokens();
      });
    }
  }
  map.on("zoomend", drawTokens);

  function renderStatusChips(){
    $("tokenStatuses").innerHTML = STATUSES.map(st =>
      `<button type="button" class="btn" data-st="${st.k}" aria-pressed="${draftStatus.includes(st.k)}">${st.label}</button>`).join("");
    $("tokenStatuses").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const k = b.dataset.st;
      draftStatus = draftStatus.includes(k) ? draftStatus.filter(x => x !== k) : [...draftStatus, k];
      renderStatusChips();
    }));
  }
  function fillLinkOptions(selected){
    const people = (typeof sharedEntries !== "undefined" ? sharedEntries : []).filter(e => e.category === "npc" || e.category === "character");
    $("tokenLink").innerHTML = `<option value="">No link</option>` + people.map(e =>
      `<option value="${e.id}"${String(e.id) === String(selected) ? " selected" : ""}>${esc(e.title)} (${esc(CAT_LABEL[e.category] || e.category)})</option>`).join("");
  }
  function closeTokenEditor(){
    tokenForm.hidden = true;
    if (editingToken && editingToken.mode === "new") {
      tokens = tokens.filter(t => t.id !== editingToken.tk.id);
      drawTokens();
    }
    editingToken = null;
  }
  function openTokenEditor(state){
    if (editingToken) closeTokenEditor();
    editingToken = state;
    const tk = state.tk;
    $("tokenDelete").hidden = state.mode !== "edit";
    $("tokenName").value = tk.name || "";
    $("tokenSize").value = String(tk.size || 1);
    $("tokenColor").value = tk.color || "amber";
    syncTokenColorChip();
    $("tokenHp").value = tk.hp ?? "";
    $("tokenMaxHp").value = tk.maxHp ?? "";
    $("tokenImg").value = tk.img || "";
    $("tokenSym").value = tk.sym || "";
    $("tokenGm").checked = !!tk.gm;
    $("tokenLight").value = tk.light || "";
    $("tokenFlip").checked = !!tk.flip;
    $("tokenLock").checked = !!tk.lock;
    draftStatus = [...(tk.status || [])];
    renderStatusChips();
    fillLinkOptions(tk.entryId || "");
    tokenForm.hidden = false;
    tokenForm.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  $("addTokenBtn").addEventListener("click", () => {
    const p = toXY(map.getCenter());
    const tk = { id: newId(), name: "New token", x: p.x, y: p.y, size: 1, color: "amber", hp: null, maxHp: null, img: "", status: [], entryId: "" };
    tokens.push(tk);
    drawTokens();
    openTokenEditor({ mode: "new", tk });
  });

  /* ---- Token repository (Shaun, 2026-11-05): a stocked shelf for the VTT.
     Everything here is Shaun's own material or generic symbols/discs: all of
     Cody's published artwork, Saint James's approved art, a symbol set,
     color discs and numbered discs. Tap an item = drop that token at the
     center of the map view, shared with the table like any other token. */

    if (effectiveGm()) for (const r of fogState.revealed)

  }
  $("fogEnabled").addEventListener("change", async () => { fogState.enabled = $("fogEnabled").checked; await saveFog(); renderFog(); });
  $("fogAllBtn").addEventListener("click", async () => { fogState.enabled = false; $("fogEnabled").checked = false; await saveFog(); renderFog(); });
  $("fogNoneBtn").addEventListener("click", async () => { if (!confirm("Hide the whole map? Every revealed area is forgotten.")) return; fogState = { enabled: true, revealed: [] }; $("fogEnabled").checked = true; await saveFog(); renderFog(); });

  /* ---- Drawing ---- */
  async function loadDraw(quiet){
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", drawKey()).maybeSingle();
    if (error) return;
    drawItems = (data && data.value && Array.isArray(data.value.items)) ? data.value.items : [];
    if (data && data.value && Array.isArray(data.value.layers) && data.value.layers.length) drawLayers = data.value.layers;
    drawHist.last = drawSnapshot();
    buildLayerUi();
    renderDraw();
  }
  /* Undo/redo history for drawing: saveDraw is the one choke point every
     drawing change flows through, so it snapshots the state it replaces.
     Loads set the baseline instead (a teammate's change is not my undo). */
  let drawHist = { undo: [], redo: [], applying: false, last: null };
  function drawSnapshot(){ return JSON.stringify({ items: drawItems, layers: drawLayers }); }
  async function saveDraw(){
    const snap = drawSnapshot();
    if (drawHist.last !== null && snap !== drawHist.last && !drawHist.applying) {
      drawHist.undo.push(drawHist.last);
      if (drawHist.undo.length > 50) drawHist.undo.shift();
      let total = drawHist.undo.reduce((a, s) => a + s.length, 0);
      while (total > 8000000 && drawHist.undo.length > 1) { total -= drawHist.undo[0].length; drawHist.undo.shift(); }
      drawHist.redo = [];
    }
    drawHist.last = snap;
    const { error } = await db.from(SETTINGS_TABLE).upsert({ key: drawKey(), value: { items: drawItems, layers: drawLayers }, updated_at: new Date().toISOString() }, { onConflict: "key" });
    return !error;
  }
  /* v1.71: hooks for the right-click options menu. Draw order in the
     items array IS the stacking order (renderDraw draws in order),
     so front/back is a real reorder + save + redraw. */
  window.vttDraw = {
    items: () => drawItems,
    del: async it => { drawItems = drawItems.filter(x => x !== it); const ok = await saveDraw(); renderDraw(); return ok; },
    reorder: async (it, dir) => {
      const i = drawItems.indexOf(it);
      if (i < 0) return false;
      drawItems.splice(i, 1);
      if (dir > 0) drawItems.push(it); else drawItems.unshift(it);
      const ok = await saveDraw(); renderDraw(); return ok;
    }
  };
  function uToLatLng(ux, uy){ return toLatLng(ux / MW * 100, uy / MH * 100); }
  function renderDraw(){
    drawLayer.clearLayers();
    if (!$("drawToggle").checked) return;
    const gm = effectiveGm();
    for (const it of drawItems) {
      if (it.gm && !gm) continue;
      const ldef = drawLayerDef(layerOf(it));
      if (ldef.hidden) continue;
      if (ldef.gm && !gm) continue;
      const lop = (typeof ldef.opacity === "number" ? ldef.opacity : 1) * (typeof it.opacity === "number" ? it.opacity : 1);
      const st = { pane: (it.gm || ldef.gm) ? "layerGm" : "layerMap", color: it.color || "#e8a33d", weight: it.w || 3, fillColor: it.color || "#e8a33d", interactive: false, opacity: it.fillMode === "fill" ? 0 : lop };
      const fo = it.fillMode === "fill" ? 0.35 * lop : (it.fill === false ? 0 : 0.18) * lop;
      if (it.type === "line") drawLayer.addLayer(L.polyline(it.pts.map(p => toLatLng(p[0], p[1])), { ...st, fill: false }));
      else if (it.type === "poly") drawLayer.addLayer(L.polygon(it.pts.map(p => toLatLng(p[0], p[1])), { ...st, fillOpacity: fo }));
      else if (it.type === "arrow") {
        drawLayer.addLayer(L.polyline([toLatLng(it.a[0], it.a[1]), toLatLng(it.b[0], it.b[1])], { ...st, fill: false }));
        const A = [it.a[0] / 100 * MW, it.a[1] / 100 * MH], B = [it.b[0] / 100 * MW, it.b[1] / 100 * MH];
        const ang = Math.atan2(B[1] - A[1], B[0] - A[0]), HL = CELL * 0.55;
        const h1 = [B[0] + HL * Math.cos(ang + 2.6), B[1] + HL * Math.sin(ang + 2.6)];
        const h2 = [B[0] + HL * Math.cos(ang - 2.6), B[1] + HL * Math.sin(ang - 2.6)];
        drawLayer.addLayer(L.polygon([uToLatLng(B[0], B[1]), uToLatLng(h1[0], h1[1]), uToLatLng(h2[0], h2[1])], { ...st, fillOpacity: 0.85 * lop }));
      }
      else if (it.type === "rect") drawLayer.addLayer(L.rectangle([toLatLng(it.x, it.y), toLatLng(it.x + it.w, it.y + it.h)], { ...st, fillOpacity: fo }));
      else if (it.type === "circle") drawLayer.addLayer(L.circle(toLatLng(it.x, it.y), { ...st, radius: it.r / 100 * MW, fillOpacity: fo }));
      else if (it.type === "text") drawLayer.addLayer(L.marker(toLatLng(it.x, it.y), { pane: (it.gm || ldef.gm) ? "layerGm" : "layerMap", icon: L.divIcon({ className: "atlas-icon", html: `<span class="draw-text" style="color:${it.color || "#f2e7c8"};opacity:${lop}">${esc(it.text)}</span>`, iconAnchor: [0, 0] }), interactive: false }));
      else if (it.type === "ellipse") {
        const epts = [], ecx = it.x / 100 * MW, ecy = it.y / 100 * MH;
        for (let k = 0; k < 48; k++) { const a = k / 48 * Math.PI * 2; epts.push(uToLatLng(ecx + Math.cos(a) * it.rx / 100 * MW, ecy + Math.sin(a) * it.ry / 100 * MH)); }
        drawLayer.addLayer(L.polygon(epts, { ...st, fillOpacity: fo }));
      }
      else if (it.type === "stamp") drawLayer.addLayer(L.marker(toLatLng(it.x, it.y), { pane: (it.gm || ldef.gm) ? "layerGm" : "layerMap", icon: stampIcon(it, lop), interactive: false }));
      else if (it.type === "paint") drawLayer.addLayer(L.imageOverlay(paintRotUrl(it.data), frameBounds(), { pane: (it.gm || ldef.gm) ? "layerGm" : "layerMap", opacity: lop, interactive: false }));
      else if (it.type === "template") {
        const anchorTk = it.anchor ? tokens.find(t => t.id === it.anchor) : null;
        const ox = anchorTk ? anchorTk.x : it.x, oy = anchorTk ? anchorTk.y : it.y;
        const Lun = (it.sizeFt || 20) / feetPerSquare * CELL;
        const o = [ox / 100 * MW, oy / 100 * MH];
        const tfo = (it.fill === false ? 0 : 0.22) * lop;
        if (it.shape === "circle") {
          drawLayer.addLayer(L.circle(uToLatLng(o[0], o[1]), { ...st, radius: Lun, fillOpacity: tfo }));
        } else if (it.shape === "ring") {
          drawLayer.addLayer(L.circle(uToLatLng(o[0], o[1]), { ...st, weight: Math.max(2, it.w || 3), radius: Lun, fillOpacity: 0.05 * lop }));
          drawLayer.addLayer(L.marker(uToLatLng(o[0], o[1]), { icon: L.divIcon({ className: "atlas-icon", html: `<span class="ruler-label">${it.sizeFt || 20} ft</span>`, iconAnchor: [0, 0] }), interactive: false }));
        } else if (it.shape === "square") {
          const a = (it.angle || 0) * Math.PI / 180, half = Lun / 2;

        } else {
          const a = (it.angle || 0) * Math.PI / 180;
          const end = [o[0] + Lun * Math.cos(a), o[1] + Lun * Math.sin(a)];
          if (it.shape === "cone") {
            const h = Math.atan(0.5);
            const p1 = [o[0] + Lun * Math.cos(a - h), o[1] + Lun * Math.sin(a - h)];
            const p2 = [o[0] + Lun * Math.cos(a + h), o[1] + Lun * Math.sin(a + h)];
            drawLayer.addLayer(L.polygon([uToLatLng(o[0], o[1]), uToLatLng(p1[0], p1[1]), uToLatLng(p2[0], p2[1])], { ...st, fillOpacity: tfo }));
          } else {
            const wU = ((it.widthFt || 5) / feetPerSquare) * CELL / 2;

            drawLayer.addLayer(L.polygon(c.map(p => uToLatLng(p[0], p[1])), { ...st, fillOpacity: tfo }));
          }
        }
      }
      else if (it.type === "ash") {
        drawLayer.addLayer(L.circle(uToLatLng(it.x / 100 * MW, it.y / 100 * MH), { pane: (it.gm || ldef.gm) ? "layerGm" : "layerMap", color: "#000000", weight: 1, fillColor: "#17181c", fillOpacity: 0.55 * lop, interactive: false, radius: (it.rSq || 3) * CELL }));
      }
    }
  }
  $("drawToggle").addEventListener("change", renderDraw);
  $("tokensToggle").addEventListener("change", ev => { if (ev.target.checked) tokenLayer.addTo(map); else map.removeLayer(tokenLayer); });
  $("drawLayerSel").addEventListener("change", () => {
    const def = drawLayerDef($("drawLayerSel").value);
    if (def.gm && !gmView) { alert("That is a GM-only layer — it needs GM view on."); $("drawLayerSel").value = "shared"; }
  });
  $("drawAddLayer").addEventListener("click", async () => {
    if (drawLayers.length >= 12) { alert("That's the layer limit for one map (12)."); return; }
    const name = prompt("Name the new layer:");
    if (!name || !name.trim()) return;
    const id = "layer-" + Date.now().toString(36);
    drawLayers.push({ id, name: name.trim().slice(0, 30), gm: false, hidden: false });
    buildLayerUi();
    $("drawLayerSel").value = id;
    const ok = await saveDraw();
    drawStatusEl.textContent = ok ? `Layer "${name.trim().slice(0, 30)}" added — it is now the drawing layer.` : "Layer didn't save — try again.";
    if (!ok) loadDraw(true);
  });
  /* Colour controls open the installed colour wheel (Shaun, 2026-11-06:
     no dropdown of colours, no OS colour box). toggleWheelFor is defined with

  $("drawColorAny").addEventListener("click", () => toggleWheelFor(null, $("drawColor").value));
  $("drawTool").addEventListener("change", () => {
    const t = $("drawTool").value;

  });
  $("drawFinish").addEventListener("click", () => finishPoly());
  $("drawUndo").addEventListener("click", async () => {
    const had = drawHist.undo.length > 0;
    const ok = await undoDraw();

    if (!ok && had) loadDraw(true);
  });
  $("drawClear").addEventListener("click", async () => {
    const selId = $("drawLayerSel").value;

  /* ---- Mode arbitration + pointer drawing ---- */
  let armedMode = null, drawStart = null, drawPts = null, polyPts = null;
  function setArmed(mode){
    armedMode = mode;
    if (mode && rulerOn) {
      rulerOn = false;
      $("rulerBtn").setAttribute("aria-pressed", "false");
      $("rulerBtn").textContent = "Ruler";
      if (rulerLine) { map.removeLayer(rulerLine); rulerLine = null; }
      if (rulerTip) { map.removeLayer(rulerTip); rulerTip = null; }
      rulerStart = null;
    }
    $("fogRevealBtn").setAttribute("aria-pressed", String(mode === "fog-reveal"));
    $("fogHideBtn").setAttribute("aria-pressed", String(mode === "fog-hide"));
    $("pingBtn").setAttribute("aria-pressed", String(mode === "ping"));
    if (mode) map.dragging.disable(); else if (!rulerOn) map.dragging.enable();
  }
  $("fogRevealBtn").addEventListener("click", () => setArmed(armedMode === "fog-reveal" ? null : "fog-reveal"));
  $("fogHideBtn").addEventListener("click", () => setArmed(armedMode === "fog-hide" ? null : "fog-hide"));
  $("rulerBtn").addEventListener("click", () => {
    if (rulerOn) { setArmed(null); $("drawTool").value = ""; $("tplShapeField").hidden = $("tplSizeField").hidden = true; }
  });
  function rectFromDrag(a, b){
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  }
  map.on("mousedown", e => {
    if (isProjecting()) return;
    if (armedMode === "fog-reveal" || armedMode === "fog-hide") { drawStart = toXY(e.latlng); return; }
    if (armedMode !== "draw") return;
    const tool = $("drawTool").value;
    const p = toXY(e.latlng);
    if (tool === "text") {
      const text = prompt("Text note:");
      if (text && text.trim()) {
        drawItems.push(withOp({ type: "text", x: p.x, y: p.y, text: text.trim().slice(0, 80), color: curDrawColor(), ...curLayerPatch() }));
        saveDraw().then(ok => { renderDraw(); drawStatusEl.textContent = ok ? "Note placed." : "Note didn't save."; if (!ok) loadDraw(true); });
      }
      return;
    }
    if (tool === "poly") {
      polyPts = polyPts || [];
      polyPts.push([p.x, p.y]);
      previewPoly();
      drawStatusEl.textContent = `${polyPts.length} point${polyPts.length === 1 ? "" : "s"} placed — tap "Finish shape" (or double-tap the map) to close the shape.`;
      return;
    }
    if (tool === "erase") { drawStart = { p, ll: e.latlng, erasing: true }; eraseAt(p); return; }
    drawStart = { p, ll: e.latlng };
    drawPts = tool === "line" ? [[p.x, p.y]] : null;
  });
  function previewPoly(){
    previewLayer.clearLayers();
    if (!polyPts || !polyPts.length) return;
    const color = curDrawColor();
    previewLayer.addLayer(L.polyline(polyPts.map(q => toLatLng(q[0], q[1])), { color, weight: curDrawWidth(), interactive: false }));
    for (const q of polyPts) previewLayer.addLayer(L.circleMarker(toLatLng(q[0], q[1]), { radius: 4, color, fillColor: color, fillOpacity: 1, interactive: false }));
  }
  async function finishPoly(){
    if (!polyPts || polyPts.length < 3) { drawStatusEl.textContent = "A shape needs at least 3 points — tap the map to add more, or switch tools to cancel it."; return; }
    drawItems.push(withOp({ type: "poly", pts: polyPts, color: curDrawColor(), w: curDrawWidth(), fill: curDrawFill(), ...curLayerPatch() }));
    polyPts = null; previewLayer.clearLayers();
    const ok = await saveDraw(); renderDraw();
    drawStatusEl.textContent = ok ? "Shape saved — the table sees it." : "Shape didn't save — try again.";
    if (!ok) loadDraw(true);
  }
  function eraseAt(p){
    const ux = p.x / 100 * MW, uy = p.y / 100 * MH, tol = CELL * 0.45;
    const seg = (ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1; let t = ((ux - ax) * dx + (uy - ay) * dy) / L2; t = Math.max(0, Math.min(1, t)); return Math.hypot(ux - (ax + t * dx), uy - (ay + t * dy)); };
    const sel = $("drawLayerSel").value, gm = effectiveGm();

      const it = drawItems[i];
      if (layerOf(it) !== sel) continue;
      if (it.gm && !gm) continue;
      const P = q => [q[0] / 100 * MW, q[1] / 100 * MH];
      let hit = false;
      if (it.type === "line" || it.type === "poly") { const pts = it.pts.map(P); for (let k = 0; k + 1 < pts.length && !hit; k++) hit = seg(pts[k][0], pts[k][1], pts[k + 1][0], pts[k + 1][1]) < tol; if (it.type === "poly" && pts.length > 2 && !hit) hit = seg(pts[pts.length - 1][0], pts[pts.length - 1][1], pts[0][0], pts[0][1]) < tol; }
      else if (it.type === "arrow") { const A = P(it.a), B = P(it.b); hit = seg(A[0], A[1], B[0], B[1]) < tol; }
      else if (it.type === "rect") { const a = P([it.x, it.y]), b = P([it.x + it.w, it.y + it.h]); hit = ux > Math.min(a[0], b[0]) - tol && ux < Math.max(a[0], b[0]) + tol && uy > Math.min(a[1], b[1]) - tol && uy < Math.max(a[1], b[1]) + tol; }
      else if (it.type === "circle") { const c = P([it.x, it.y]); hit = Math.hypot(ux - c[0], uy - c[1]) < it.r / 100 * MW + tol; }
      else if (it.type === "text" || it.type === "template") { const c = P([it.x, it.y]); hit = Math.hypot(ux - c[0], uy - c[1]) < CELL; }
      else if (it.type === "ash") { const c = P([it.x, it.y]); hit = Math.hypot(ux - c[0], uy - c[1]) < (it.rSq || 3) * CELL + tol / 2; }
      if (hit) {
        drawItems.splice(i, 1);
        saveDraw().then(ok => { renderDraw(); drawStatusEl.textContent = ok ? "Erased." : "Erase didn't save — refreshed."; if (!ok) loadDraw(true); });
        return;
      }
    }
  }
  map.on("mousemove", e => {
    if (!drawStart) return;
    const p = toXY(e.latlng);
    previewLayer.clearLayers();

      const r = rectFromDrag(drawStart, p);

    } else if (tool === "line" && drawPts) {

    } else if (tool === "circle") {

  map.on("dblclick", () => { if (armedMode === "draw" && $("drawTool").value === "poly") finishPoly(); });
  map.on("mouseup", async e => {
    if (!drawStart) return;

    drawStart = null; drawPts = null;
    previewLayer.clearLayers();
    const p = toXY(e.latlng);
    if (armedMode === "fog-reveal" || armedMode === "fog-hide") {
      const r = rectFromDrag(start, p);
      if (r.w < 0.2 || r.h < 0.2) return;

        if (!fogState.enabled) { fogState.enabled = true; $("fogEnabled").checked = true; }
        const ok = await saveFog(); renderFog();
        $("gmStatus").textContent = ok ? "Area revealed for the players." : "Fog change didn't save — try again.";
      } else {
        fogState.revealed = fogState.revealed.filter(q => !(q.x < r.x + r.w && q.x + q.w > r.x && q.y < r.y + r.h && q.y + q.h > r.y));
        const ok = await saveFog(); renderFog();
        $("gmStatus").textContent = ok ? "Revealed areas touched by that drag are hidden again." : "Fog change didn't save — try again.";
      }
      return;
    }
    if (armedMode !== "draw") return;
    const tool = $("drawTool").value, color = $("drawColor").value;
    if (tool === "erase" || tool === "poly") return;
    const layerPatch = curLayerPatch();
    let item = null;
    if (tool === "line" && startPts && startPts.length > 1) item = { type: "line", pts: smoothLine(startPts), color, w: curDrawWidth(), ...layerPatch };
    else if (tool === "arrow") { const d = Math.hypot((p.x - start.p.x) / 100 * MW, (p.y - start.p.y) / 100 * MH); if (d > 2) item = { type: "arrow", a: [start.p.x, start.p.y], b: [p.x, p.y], color, w: curDrawWidth(), ...layerPatch }; }
    else if (tool === "rect") { const r = rectFromDrag(start.p, p); if (r.w > 0.1 && r.h > 0.1) item = { type: "rect", ...r, color, w: curDrawWidth(), fill: curDrawFill(), ...layerPatch }; }
    else if (tool === "circle") {
      const rUnits = Math.hypot((p.x - start.p.x) / 100 * MW, (p.y - start.p.y) / 100 * MH);
      if (rUnits > 2) item = { type: "circle", x: start.p.x, y: start.p.y, r: rUnits / MW * 100, color, w: curDrawWidth(), fill: curDrawFill(), ...layerPatch };
    } else if (tool === "template") {
      const shape = $("tplShape").value;
      const sizeFt = Math.max(5, parseInt($("tplSize").value, 10) || 20);
      let angle = 0;
      if (shape !== "circle") {
        const dx = (p.x - start.p.x) / 100 * MW, dy = (p.y - start.p.y) / 100 * MH;
        angle = Math.round(Math.atan2(dy, dx) * 180 / Math.PI);
      }
      item = { type: "template", shape, x: start.p.x, y: start.p.y, sizeFt, angle, color, w: curDrawWidth(), fill: curDrawFill(), ...layerPatch };
    }
    if (!item) return;
    drawItems.push(withOp(item));
    const ok = await saveDraw(); renderDraw();
    drawStatusEl.textContent = ok ? "Drawing saved — the table sees it." : "Drawing didn't save — try again.";
    if (!ok) loadDraw(true);
  });

  /* Entering/leaving projection re-renders the player-facing pieces. */
  new MutationObserver(() => { renderFog(); drawTokens(); renderDraw(); })
    .observe(document.body, { attributes: true, attributeFilter: ["class"] });

  /* Follow map switches; keep fog and drawings fresh. */
  let lastMapId = currentMapId;
  loadFog();
  buildLayerUi();
  loadDraw();
  applyGmUi();
  setInterval(() => {
    if (currentMapId !== lastMapId) { lastMapId = currentMapId; loadFog(true); loadDraw(true); }
  }, 3000);
  setInterval(() => { loadFog(true); loadDraw(true); }, 60000);

  /* ================= VTT Phase 3: shared dice log, macros, initiative =================
     Dice rolls and initiative are table state (shared store, not per map);
     initiative is built from the loaded map's tokens. Macros are per-device
     (this page has no accounts, so they live in this browser, keyed by the
     name you roll as). */
  let diceRolls = [];
  const diceStatusEl = $("diceStatus");
  function parseExpr(expr){
    const cleaned = String(expr || "").replace(/\s+/g, "");
    if (!cleaned) return null;
    const parts = cleaned.match(/[+-]?[^+-]+/g);
    if (!parts) return null;
    let total = 0;
    const detail = [];
    for (const part of parts) {
      const sign = part.startsWith("-") ? -1 : 1;
      const term = part.replace(/^[+-]/, "");
      const dm = term.match(/^(\d*)d(\d+)$/i);
      if (dm) {
        const n = dm[1] === "" ? 1 : parseInt(dm[1], 10);
        const sides = parseInt(dm[2], 10);
        if (n < 1 || n > 100 || sides < 2 || sides > 1000) return null;
        const rolls = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * sides));
        total += sign * rolls.reduce((a, b) => a + b, 0);
        detail.push({ term: `${n}d${sides}`, rolls, sign });
      } else if (/^\d+$/.test(term)) {
        const flat = parseInt(term, 10);
        total += sign * flat;
        detail.push({ term: String(flat), rolls: null, sign, flat });
      } else return null;
    }
    return { total, detail };
  }
  function detailText(entry){
    return entry.detail.map(d => d.rolls ? `${d.sign < 0 ? "− " : ""}${d.term}[${d.rolls.join(", ")}]` : `${d.sign < 0 ? "− " : "+ "}${d.flat}`).join(" ").replace(/^\+ /, "");
  }
  function renderDice(){
    $("diceLog").innerHTML = [...diceRolls].slice(-20).reverse().map(r =>
      `<li><strong>${esc(r.who)}</strong>${r.label ? ` — ${esc(r.label)}` : ""}: <span class="dl-total">${r.total}</span> <span class="muted">(${esc(r.expr)}: ${esc(detailText(r))})</span></li>`).join("");
  }
  async function loadDice(quiet){
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", "dice_log").maybeSingle();
    if (error) return;
    diceRolls = (data && data.value && Array.isArray(data.value.rolls)) ? data.value.rolls : [];
    renderDice();
  }
  async function saveDice(){
    const { error } = await db.from(SETTINGS_TABLE).upsert({ key: "dice_log", value: { rolls: diceRolls }, updated_at: new Date().toISOString() }, { onConflict: "key" });
    return !error;
  }
  async function doRoll(expr, label){
    const parsed = parseExpr(expr);
    if (!parsed) { diceStatusEl.textContent = "Can't read that roll — try 2d6+3 or 1d20."; return; }
    const who = $("diceName").value.trim() || "Someone at the table";
    localStorage.setItem("apocDiceName", who);
    await loadDice(true);
    diceRolls = [...diceRolls, { who, label: (label || "").trim(), expr: String(expr).trim(), total: parsed.total, detail: parsed.detail, ts: Date.now() }].slice(-50);
    renderDice();
    const ok = await saveDice();
    diceStatusEl.textContent = ok ? `${who} rolled ${parsed.total}.` : "That roll didn't reach the shared log — try again.";
    if (!ok) loadDice(true);
  }
  $("diceName").value = localStorage.getItem("apocDiceName") || "";
  $("diceRollBtn").addEventListener("click", () => doRoll($("diceExpr").value, $("diceLabel").value));
  $("diceExpr").addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); doRoll($("diceExpr").value, $("diceLabel").value); } });
  $("quickDice").querySelectorAll("button").forEach(b => b.addEventListener("click", () => doRoll(`1d${b.dataset.sides}`, $("diceLabel").value)));
  $("clearDiceBtn").addEventListener("click", async () => {
    if (!confirm("Clear the shared roll log for everybody?")) return;
    diceRolls = [];
    renderDice();
    await saveDice();
  });
  /* Macros — saved on this device, under your table name. */
  function getMacros(){ try { return JSON.parse(localStorage.getItem("apocMacros") || "[]"); } catch(e) { return []; } }
  function renderMacros(){
    const macros = getMacros();
    $("macroRow").innerHTML = macros.map((m, i) =>
      `<span class="macro-chip"><button type="button" class="btn" data-macro="${i}">${esc(m.name)}</button><button type="button" class="btn" data-macro-del="${i}" aria-label="Delete macro">×</button></span>`).join("");
    $("macroRow").querySelectorAll("[data-macro]").forEach(b => b.addEventListener("click", () => { const m = getMacros()[Number(b.dataset.macro)]; if (m) doRoll(m.expr, m.label); }));
    $("macroRow").querySelectorAll("[data-macro-del]").forEach(b => b.addEventListener("click", () => {
      const macros2 = getMacros(); macros2.splice(Number(b.dataset.macroDel), 1);
      localStorage.setItem("apocMacros", JSON.stringify(macros2)); renderMacros();
    }));
  }
  $("saveMacroBtn").addEventListener("click", () => {
    const expr = $("diceExpr").value.trim();
    if (!parseExpr(expr)) { diceStatusEl.textContent = "Set a valid roll first, then save it as a macro."; return; }
    const label = $("diceLabel").value.trim();
    const macros = getMacros();
    macros.push({ name: label || expr, expr, label });
    localStorage.setItem("apocMacros", JSON.stringify(macros.slice(-12)));
    renderMacros();
    diceStatusEl.textContent = `Macro saved on this device: ${label || expr}.`;
  });

  /* ---- Initiative ---- */
  let initState = { order: [], turn: 0, round: 1 };
  const stripCtl = L.control({ position: "topright" });
  stripCtl.onAdd = () => { const d = L.DomUtil.create("div", "init-strip"); d.id = "initStrip"; d.hidden = true; return d; };
  stripCtl.addTo(map);
  async function loadInit(quiet){
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", "initiative").maybeSingle();
    if (error) return;
    if (data && data.value && Array.isArray(data.value.order)) initState = { order: data.value.order, turn: data.value.turn || 0, round: data.value.round || 1 };
    renderInit();
  }
  async function saveInit(){
    const { error } = await db.from(SETTINGS_TABLE).upsert({ key: "initiative", value: initState, updated_at: new Date().toISOString() }, { onConflict: "key" });
    return !error;
  }
  function renderInit(){
    const { order, turn, round } = initState;
    $("initMeta").textContent = order.length
      ? `Round ${round} — ${order[turn] ? order[turn].name + " is up." : ""} Tap a name to jump the map to that token.`
      : "No combat running. Start builds the order from the tokens on the loaded map; tap a name in the order to jump the map to that token.";
    $("initList").innerHTML = order.map((o, i) =>
      `<li class="init-row${i === turn ? " active" : ""}"><span class="init-name" data-init-fly="${i}">${esc(o.name)}</span><input type="number" value="${o.init}" data-init-val="${i}" aria-label="Initiative for ${esc(o.name)}"><button type="button" class="btn" data-init-roll="${i}">d20</button><button type="button" class="btn" data-init-del="${i}" aria-label="Remove">×</button></li>`).join("");
    const actRow = $("initList").querySelector(".init-row.active");
    if (actRow) actRow.scrollIntoView({ block: "nearest" });
    $("initList").querySelectorAll("[data-init-val]").forEach(inp => inp.addEventListener("change", async () => {
      const v = parseInt(inp.value, 10);
      initState.order[Number(inp.dataset.initVal)].init = Number.isFinite(v) ? v : 0;
      await saveInit(); renderInit();
    }));
    $("initList").querySelectorAll("[data-init-roll]").forEach(b => b.addEventListener("click", async () => {
      initState.order[Number(b.dataset.initRoll)].init = 1 + Math.floor(Math.random() * 20);
      await saveInit(); renderInit();
    }));
    $("initList").querySelectorAll("[data-init-del]").forEach(b => b.addEventListener("click", async () => {
      initState.order.splice(Number(b.dataset.initDel), 1);
      if (initState.turn >= initState.order.length) initState.turn = Math.max(0, initState.order.length - 1);
      await saveInit(); renderInit();
    }));
    $("initList").querySelectorAll("[data-init-fly]").forEach(el => el.addEventListener("click", () => {
      const o = initState.order[Number(el.dataset.initFly)];
      const tk = tokens.find(t => t.id === o.tokenId);
      if (tk) map.flyTo(toLatLng(tk.x, tk.y), Math.max(map.getZoom(), 0));
    }));
    const notIn = tokens.filter(t => !order.some(o => o.tokenId === t.id));
    $("initAddSelect").innerHTML = notIn.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("") || `<option value="">(all tokens in)</option>`;
    const strip = $("initStrip");
    if (strip) {
      strip.hidden = !order.length;
      strip.innerHTML = order.length ? `<strong>Round ${round}</strong> · ` + order.map((o, i) => i === turn ? `<strong>${esc(o.name)} (${o.init})</strong>` : `${esc(o.name)} (${o.init})`).join(" → ") : "";
    }
  }
  $("initStartBtn").addEventListener("click", async () => {
    if (!tokens.length) { $("initMeta").textContent = "No tokens on the loaded map yet — add tokens first, then start."; return; }
    if (initState.order.length && !confirm("Replace the current order with the loaded map's tokens?")) return;
    initState = { order: tokens.map(t => ({ tokenId: t.id, name: t.name, init: 0 })), turn: 0, round: 1 };
    await saveInit(); renderInit();
  });
  $("initRollAllBtn").addEventListener("click", async () => {
    for (const o of initState.order) o.init = 1 + Math.floor(Math.random() * 20);
    await saveInit(); renderInit();
  });
  $("initSortBtn").addEventListener("click", async () => {
    initState.order.sort((a, b) => b.init - a.init);
    await saveInit(); renderInit();
  });
  $("initNextBtn").addEventListener("click", async () => {
    if (!initState.order.length) return;
    initState.turn++;
    if (initState.turn >= initState.order.length) { initState.turn = 0; initState.round++; }
    await saveInit(); renderInit();
  });
  $("initPrevBtn").addEventListener("click", async () => {
    if (!initState.order.length) return;
    initState.turn--;
    if (initState.turn < 0) { initState.turn = initState.order.length - 1; initState.round = Math.max(1, initState.round - 1); }
    await saveInit(); renderInit();
  });
  $("initEndBtn").addEventListener("click", async () => {
    if (!initState.order.length) return;
    if (!confirm("End combat and clear the order for everybody?")) return;
    initState = { order: [], turn: 0, round: 1 };
    await saveInit(); renderInit();
  });
  $("initAddBtn").addEventListener("click", async () => {
    const id = $("initAddSelect").value;
    const tk = tokens.find(t => t.id === id);
    if (!tk) return;
    initState.order.push({ tokenId: tk.id, name: tk.name, init: 0 });
    await saveInit(); renderInit();
  });

  loadDice();
  loadInit();
  renderMacros();
  setInterval(() => { loadDice(true); loadInit(true); }, 30000);

  /* ---- Map switching: every map loads into the SAME VTT surface (one engine,
        one projection). The loaded map is a shared setting — switch it on one
        screen and every screen, TV included, follows. Each map keeps its own
        tokens and scale (per-map store keys); the Faerûn markers and atlas
        belong to the world map's own definition. ---- */
  const MAPS = {
    faerun: { name: "Faerûn — World Map", img: "assets/maps/faerun-3e.webp", w: 4763, h: 3185, cell: 60 },
    "saint-james": { name: "Arcanic Rendez-Vous — Saint James's floors", img: "assets/maps/saint-james-floors.webp", w: 1662, h: 1077, cell: 50 }
  };
  const ACTIVE_KEY = "vtt_active";
  function switchMap(id){
    const def = MAPS[id];
    if (!def) return;
    currentMapId = id;
    mapRot = 0; /* rotation is per map: the incoming map starts natural until its own stored rotation lands via loadVttSettings */
    MW = def.w; MH = def.h; CELL = def.cell;
    bounds = [[0, 0], [MH, MW]];
    map.setMaxBounds([[-MH * 0.08, -MW * 0.08], [MH * 1.08, MW * 1.08]]);
    map.removeLayer(baseOverlay);
    baseOverlay = L.imageOverlay(def.img, bounds, { pane: "layerMap" }).addTo(map);
    baseOverlay.bringToBack();
    drawVeil();
    $("mapSelect").value = id;
    map.fitBounds(bounds);
    drawGrid();
    if (gridOn) gridLayer.addTo(map);
    layer.addTo(map);
    markers = [];
    draw();
    places = [];
    drawPlaces();
    if (id === "faerun") {
      if ($("atlasToggle").checked) atlasLayer.addTo(map);
      if ($("apocToggle").checked) veilLayer.addTo(map);
    } else {
      map.removeLayer(atlasLayer);
      map.removeLayer(veilLayer);
    }
    loadMarkers(true);
    loadPlaces(true);
    loadTokens(true);
    loadVttSettings(true);
    setStatus(`Map loaded: ${def.name}.`);
  }
  async function saveActiveMap(){
    await db.from(SETTINGS_TABLE).upsert(
      { key: ACTIVE_KEY, value: { mapId: currentMapId }, updated_at: new Date().toISOString() },
      { onConflict: "key" }
    );
  }

  /* ---- Rotate map: bitmap rotation helpers + the one apply path ----
     The base map image is the only full-frame bitmap; it is fetched and
     drawn rotated onto a canvas at FULL original resolution (the storage
     bucket serves Access-Control-Allow-Origin: *, and the built-in maps
     are same-origin, so the fetch is CORS-clean). Results are cached per
     map + rotation as object URLs. */
  const rotImgCache = new Map();
  function rotateCanvasCopy(src, rot){
    const odd = rot % 2 === 1;
    const cv = document.createElement("canvas");
    cv.width = odd ? src.height : src.width;
    cv.height = odd ? src.width : src.height;
    const cx = cv.getContext("2d");
    cx.translate(cv.width / 2, cv.height / 2);
    cx.rotate(rot * Math.PI / 2);
    cx.drawImage(src, -src.width / 2, -src.height / 2);
    return cv;
  }
  async function rotatedMapUrl(def){
    if (!mapRot) return def.img;
    const key = currentMapId + "|" + mapRot;
    if (rotImgCache.has(key)) return rotImgCache.get(key);
    const resp = await fetch(def.img);
    const blob = await resp.blob();
    const bmp = await createImageBitmap(blob);
    const cv = rotateCanvasCopy(bmp, mapRot);
    if (bmp.close) bmp.close();
    const out = await new Promise(res => cv.toBlob(res, blob.type || "image/png"));
    const url = URL.createObjectURL(out || blob);
    rotImgCache.set(key, url);
    return url;
  }
  /* Re-render the whole table in the current rotation: swap the base
     overlay for the rotated bitmap, re-fit the view to the rotated frame,
     and redraw every layer through the (now rotation-aware) helpers. */
  async function applyMapRotation(){
    const idAtStart = currentMapId, rotAtStart = mapRot;
    const def = MAPS[currentMapId];
    bounds = frameBounds();
    map.setMaxBounds([[-frameH() * 0.08, -frameW() * 0.08], [frameH() * 1.08, frameW() * 1.08]]);
    if (def) {
      let url = def.img;
      try { url = await rotatedMapUrl(def); } catch(e) { url = def.img; }
      if (idAtStart !== currentMapId || rotAtStart !== mapRot) return; /* a newer switch/rotation superseded this one */
      if (baseOverlay._url !== url) {
        map.removeLayer(baseOverlay);
        baseOverlay = L.imageOverlay(url, bounds, { pane: "layerMap" }).addTo(map);
        baseOverlay.bringToBack();
      } else baseOverlay.setBounds(bounds);
    }
    drawVeil();
    draw();
    drawPlaces();
    drawTokens();
    drawGrid();
    if (gridOn) gridLayer.addTo(map);
    renderFog();
    renderDraw();
    renderLighting();
    map.fitBounds(bounds);
  }
  $("rotateMapBtn").addEventListener("click", async () => {
    mapRot = (mapRot + 1) % 4;
    const ok = await saveVttSettings();
    await applyMapRotation();
    tokenStatusEl.textContent = ok
      ? `Map rotated to ${mapRot * 90}°.`
      : "That rotation didn't save — refreshed.";
    if (!ok) loadVttSettings(true);
  });
  async function loadActiveMap(){
    const { data } = await db.from(SETTINGS_TABLE).select("value").eq("key", ACTIVE_KEY).maybeSingle();
    const id = data && data.value && MAPS[data.value.mapId] ? data.value.mapId : "faerun";
    if (id !== currentMapId) switchMap(id);
  }
  $("mapSelect").addEventListener("change", async () => { switchMap($("mapSelect").value); await saveActiveMap(); });
  loadActiveMap();
  setInterval(loadActiveMap, 60000);

  loadMarkers();
  setInterval(() => loadMarkers(true), 60000);
  setInterval(() => loadPlaces(true), 60000);
  try {
    db.channel("markers-live").on("postgres_changes", { event: "*", schema: "public", table: SETTINGS_TABLE, filter: "key=eq.map_markers" }, () => loadMarkers(true)).subscribe();
  } catch(e) { /* realtime is a bonus; the 60-second refresh stands */ }

  /* ---- Ping (Roll20): arm Ping, press-and-hold the map, every screen at
        the table sees the pulse. Shared through the same store: key vtt_ping (per-map suffix
        rule like the other VTT keys), value {x, y, ts, by} in map % coords.
        One shot: dropping a ping disarms the tool again. ---- */
  const pingKey = () => currentMapId === "faerun" ? "vtt_ping" : `vtt_ping_${currentMapId}`;
  let pingShownTs = 0, pingMarker = null, pingHideTimer = null;
  function clearPing(){
    if (pingMarker) { map.removeLayer(pingMarker); pingMarker = null; }
    if (pingHideTimer) { clearTimeout(pingHideTimer); pingHideTimer = null; }
  }
  function showPing(p){
    clearPing();
    pingMarker = L.marker(toLatLng(p.x, p.y), { pane: "layerForeground", interactive: false, icon: L.divIcon({ className: "ping-icon", html: '<span class="ping-ring"></span><span class="ping-dot"></span>', iconSize: [44, 44], iconAnchor: [22, 22] }) }).addTo(map);
    pingHideTimer = setTimeout(clearPing, Math.max(0, 9000 - (Date.now() - (p.ts || 0))));
  }
  async function loadPing(quiet){
    if (!db) return;
    const { data, error } = await db.from(SETTINGS_TABLE).select("value").eq("key", pingKey()).maybeSingle();
    if (error || !data || !data.value) return;
    const p = data.value;
    if (typeof p.x !== "number" || typeof p.y !== "number" || !p.ts) return;
    if (p.ts === pingShownTs || Date.now() - p.ts > 9000) return;
    pingShownTs = p.ts;
    showPing(p);
  }
  async function dropPing(p){
    const rec = { x: p.x, y: p.y, ts: Date.now(), by: localStorage.getItem("apocDiceName") || "" };
    pingShownTs = rec.ts;
    showPing(rec);
    if (db) await db.from(SETTINGS_TABLE).upsert({ key: pingKey(), value: rec, updated_at: new Date().toISOString() }, { onConflict: "key" });
  }
  $("pingBtn").addEventListener("click", () => setArmed(armedMode === "ping" ? null : "ping"));
  /* Roll20 rule (Shaun, 2026-11-06): with Ping armed, an ordinary tap must
     NOT ping, and neither must a grab — arming disables map dragging, so a
     grab-and-drag ended as a plain Leaflet click and dropped a ping every
     time he caught the map. A ping now needs a deliberate press-and-hold in
     place (~700 ms without drifting more than a few px); letting go early
     or moving cancels it. Still one shot: a dropped ping disarms the tool. */
  const PING_HOLD_MS = 700, PING_HOLD_SLOP = 6;
  let pingHoldTimer = null, pingHoldAt = null, pingHoldLatLng = null, pingFired = false;
  function cancelPingHold(){
    if (pingHoldTimer) { clearTimeout(pingHoldTimer); pingHoldTimer = null; }
    pingHoldAt = null; pingHoldLatLng = null;
  }
  const pingSurface = map.getContainer();
  pingSurface.addEventListener("pointerdown", e => {
    if (armedMode !== "ping" || isProjecting() || rulerOn) return;
    cancelPingHold();
    pingHoldAt = { x: e.clientX, y: e.clientY };
    try { pingHoldLatLng = map.mouseEventToLatLng(e); } catch (err) { pingHoldLatLng = null; }
    if (!pingHoldLatLng) { pingHoldAt = null; return; }
    pingHoldTimer = setTimeout(() => {
      pingHoldTimer = null;
      if (armedMode !== "ping" || isProjecting() || rulerOn || !pingHoldLatLng) { cancelPingHold(); return; }
      const p = toXY(pingHoldLatLng);
      cancelPingHold();
      /* Disarm on release, not here: the pointerup that ends the hold also
         produces a Leaflet click, and the other click handlers must still
         see Ping armed when it lands — otherwise the marker editor opens
         on top of the ping. pingRelease() below does the disarm. */
      pingFired = true;
      dropPing(p);
    }, PING_HOLD_MS);
  });
  pingSurface.addEventListener("pointermove", e => {
    if (!pingHoldAt) return;
    if (Math.abs(e.clientX - pingHoldAt.x) > PING_HOLD_SLOP || Math.abs(e.clientY - pingHoldAt.y) > PING_HOLD_SLOP) cancelPingHold();
  });
  function pingRelease(){
    if (pingFired) {
      pingFired = false;
      setTimeout(() => { if (armedMode === "ping") setArmed(null); }, 60);
    }
    cancelPingHold();
  }
  pingSurface.addEventListener("pointerup", pingRelease);
  pingSurface.addEventListener("pointercancel", pingRelease);
  pingSurface.addEventListener("pointerleave", cancelPingHold);
  setInterval(() => loadPing(true), 4000);
  loadPing(true);

  /* ================= Art program build-out (Shaun, 2026-11-06) =================
     Everything below lives inside the same vtt_draw {items, layers} store:
     new tools add OPTIONAL fields (opacity) and new item types (ellipse,
     stamp, paint) alongside the originals — old saves load and render
     exactly as before. The paint/clone/bucket tools work on a per-layer
     raster item (kind "paint"); maps themselves are never re-encoded. */
  const artFx = L.layerGroup().addTo(map);

  function curDrawOpacity(){
    const v = parseFloat($("drawOpacity").value);
    return Number.isFinite(v) ? Math.min(1, Math.max(0.05, v)) : 1;
  }
  function withOp(item){
    const o = curDrawOpacity();
    if (o < 1) item.opacity = Math.round(o * 100) / 100;
    const fm = $("drawFillMode").value;
    if (fm !== "both" && /^(rect|circle|ellipse|polygon)$/.test(item.type)) { item.fillMode = fm; item.fill = fm !== "outline"; }
    return item;
  }
  function smoothLine(pts){
    if (!pts || pts.length < 3) return pts;

  /* ---- Stamps: the token symbols + library art, placed as drawings ---- */

  function placeStamp(p){

  /* ---- Raster paint layer: one canvas per drawing layer, kept as a

    paintRotCache.set(key, data); /* placeholder so renders never block; replaced when the rotated copy is ready */

  /* ---- Clone stamp (Photoshop-style point clone) + eyedropper sample.

     same-origin or served with CORS — both true for the built-ins and

  let cloneSrc = null, cloneStroke = null, sampleCanvas = null, cloneMark = null;

      if (it.type !== "paint") continue;

      saveLighting().then(ok => { renderLighting(); lightStatusEl.textContent = ok ? `${src.name} placed — tap it to adjust.` : "Light didn't save — refreshed."; if (!ok) loadLighting(true); else openLightEditor(src); });
    }
  });
  map.on("mousemove", e => {
    if (!lightSegStart || (armedMode !== "wall" && armedMode !== "door" && armedMode !== "window")) return;
    previewLayer.clearLayers();

    const ok = await saveLighting(); renderLighting();
    lightStatusEl.textContent = ok ? `${armedMode === "door" ? "Door" : armedMode === "window" ? "Window" : "Wall"} segment saved — keep tapping to chain, or toggle the tool off.` : "Segment didn't save — refreshed.";
    if (!ok) loadLighting(true);

  const _drawTokensLT = drawTokens;

  } catch(e) { /* realtime is a bonus; the 30-second refresh stands */ }

  /* ---- Measure from a token + tool keyboard shortcuts ---- */
  map.on("mousedown", e => {
    if (!rulerOn || isProjecting()) return;
    const p = toXY(e.latlng);
    const tk = tokens.find(t => Math.hypot((t.x - p.x) / 100 * MW, (t.y - p.y) / 100 * MH) < (t.size || 1) * CELL / 2 + CELL * 0.3);
    if (tk) {
      rulerStart = L.latLng(toLatLng(tk.x, tk.y));
      if (rulerLine) rulerLine.setLatLngs([rulerStart, rulerStart]);
      if (rulerTip) rulerTip.setLatLng(rulerStart);
